<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Terminal v1.7</title>
<style>html,body{margin:0;background:#000;color:#8e8e93;font-family:system-ui;height:100%;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div id="s">Загрузка v1.7…</div>
<script>
(async()=>{
  const el=document.getElementById('s');
  try{
    const bases=[
      './deploy/',
      'https://cdn.jsdelivr.net/gh/Romlya/ai-trading-terminal@main/deploy/',
      'https://raw.githubusercontent.com/Romlya/ai-trading-terminal/main/deploy/'
    ];
    let html='', err;
    for(const base of bases){
      try{
        html='';
        for(let i=0;i<10;i++){
          const r=await fetch(base+'idx'+i+'.txt',{cache:'no-store'});
          if(!r.ok)throw new Error('idx'+i+' '+r.status);
          html+=await r.text();
        }
        err=null;break;
      }catch(e){err=e}
    }
    if(err)throw err;
    if(html.indexOf('updateDecisionHud')<0)throw new Error('bad app');
    document.open();document.write(html);document.close();
  }catch(e){
    el.textContent='Ошибка: '+(e&&e.message?e.message:e);
    console.error(e);
  }
})();
</script>
</body>
</html>
