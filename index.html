<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#000000;--bg2:#0c0c0c;--elev:#121212;--elev2:#1c1c1e;
  --line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);
  --t1:#f5f5f7;--t2:#8e8e93;--t3:#636366;
  --green:#30d158;--red:#ff453a;--blue:#0a84ff;--amber:#ffd60a;
  --r:14px;--r2:12px;--r3:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%}
.hdr{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px 10px}
.hdr-row{display:flex;align-items:center;gap:8px}
.sym{font-weight:700;font-size:18px;letter-spacing:-.4px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.sym i{display:block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--t3);margin-top:2px}
.price{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.chg{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.chg.up{color:var(--green);background:rgba(48,209,88,.12)}
.chg.dn{color:var(--red);background:rgba(255,69,58,.12)}
.hdr-sp{flex:1}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--elev);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn.on{background:rgba(10,132,255,.12);border-color:rgba(10,132,255,.35);color:var(--blue)}
.tf-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.tf{display:flex;flex:1;background:var(--elev);border-radius:10px;padding:3px;gap:2px}
.tf button{flex:1;border:none;background:transparent;padding:8px 0;border-radius:8px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;letter-spacing:-.2px}
.tf button.on{background:var(--elev2);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.togs{display:flex;gap:6px;flex-shrink:0}
.tog{border:1px solid var(--line);background:var(--elev);padding:8px 11px;border-radius:10px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer}
.tog.on{background:rgba(10,132,255,.12);border-color:rgba(10,132,255,.35);color:var(--blue)}
.page{display:none;height:100%;overflow:hidden;flex-direction:column;background:var(--bg)}
.page.on{display:flex}
.pos-bar{display:none;align-items:center;gap:10px;padding:8px 12px;margin:8px 12px 0;background:var(--elev);border-radius:var(--r2);border:1px solid var(--line);font-size:12px}
.pos-bar.on{display:flex}
.pos-bar .tag{font-weight:700;padding:3px 8px;border-radius:6px;font-size:11px}
.pos-bar .tag.long{background:rgba(48,209,88,.15);color:var(--green)}
.pos-bar .tag.short{background:rgba(255,69,58,.15);color:var(--red)}
.pos-bar .meta{color:var(--t2);flex:1;font-variant-numeric:tabular-nums}
.pos-bar .pnl{font-weight:700;font-variant-numeric:tabular-nums}
.pos-bar .close-btn{border:none;background:var(--elev2);color:var(--t1);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}
.chart-wrap{flex:1;position:relative;min-height:0;margin:8px 10px;border-radius:16px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
#chart{width:100%;height:100%}
#ov{position:absolute;inset:0;pointer-events:none;z-index:5}
#vp{position:absolute;top:2px;bottom:18px;right:60px;width:56px;pointer-events:none;z-index:6}
.st{position:absolute;left:10px;bottom:8px;font-size:10px;color:var(--t3);background:rgba(0,0,0,.65);padding:4px 8px;border-radius:6px;z-index:10;display:flex;align-items:center;gap:5px}
.conn{width:6px;height:6px;border-radius:50%;background:#555;flex-shrink:0}
.conn.ok{background:var(--green)}.conn.bad{background:var(--red)}.conn.wait{background:var(--amber)}
.qbar{display:flex;align-items:center;gap:6px;padding:4px 12px 2px;flex-shrink:0}
.qsz{display:flex;gap:4px;flex:1;overflow-x:auto}
.qsz button{border:1px solid var(--line);background:var(--elev);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;white-space:nowrap}
.qsz button.on{background:var(--elev2);color:var(--t1);border-color:var(--line2)}
.qbuy,.qsell{border:none;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;min-width:64px}
.qbuy{background:var(--green)}.qsell{background:var(--red)}
.qbe{border:1px solid var(--line);background:var(--elev);padding:9px 12px;border-radius:10px;font-size:12px;font-weight:700;color:var(--amber);cursor:pointer}
.tools{display:flex;justify-content:center;gap:6px;padding:6px 12px 8px;flex-shrink:0}
.tools button{border:1px solid var(--line);background:var(--elev);min-width:54px;height:36px;border-radius:10px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer}
.tools button.on{background:rgba(10,132,255,.14);border-color:rgba(10,132,255,.4);color:var(--blue)}
.page-head{padding:20px 20px 8px}
.page-head .label{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:4px}
.page-head h1{font-size:28px;font-weight:700;letter-spacing:-.6px}
.page-head p{font-size:14px;color:var(--t2);margin-top:6px}
.filt{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto}
.filt::-webkit-scrollbar{display:none}
.filt button{border:1px solid var(--line);background:var(--elev);padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;color:var(--t3);cursor:pointer;white-space:nowrap}
.filt button.on{background:var(--elev2);border-color:var(--line2);color:var(--t1)}
.list{flex:1;overflow-y:auto;padding:0 12px 12px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;padding:14px 16px;margin-bottom:6px;background:var(--elev);border-radius:var(--r2);cursor:pointer;gap:10px;border:1px solid var(--line)}
.row:active{background:var(--elev2)}
.row .n{font-weight:600;font-size:14px;min-width:80px}
.row .p{flex:1;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.row .c{min-width:70px;text-align:right;font-size:13px;font-weight:600}
.row .c.up{color:var(--green)}.row .c.dn{color:var(--red)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin-right:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.stat{background:var(--elev);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line)}
.stat .sl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat .sv{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.trade-box{padding:8px 16px 20px;overflow-y:auto;flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r2);font-size:16px;background:var(--elev);color:var(--t1);outline:none}
.sides{display:flex;gap:10px;margin-top:8px}
.sides button{flex:1;padding:15px;border:none;border-radius:var(--r2);font-size:15px;font-weight:700;cursor:pointer;color:#fff}
.sides .buy{background:var(--green)}.sides .sell{background:var(--red)}
.note{font-size:12px;color:var(--t3);margin-top:16px;line-height:1.5;padding:12px 14px;background:var(--elev);border-radius:var(--r2);border:1px solid var(--line)}
.orders-box{margin-top:16px}
.orders-box h3{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;margin-bottom:8px}
.order-item{padding:12px 14px;background:var(--elev);border-radius:var(--r3);margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line)}
.pos-card{margin:0 12px 12px;padding:14px 16px;background:var(--elev);border-radius:var(--r);border:1px solid var(--line)}
.pos-card h3{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;margin-bottom:10px}
.pos-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.pos-row span:first-child{color:var(--t3)}
.up{color:var(--green)}.dn{color:var(--red)}
.nav{display:flex;height:60px;background:rgba(8,8,8,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line);padding:4px 6px calc(4px + var(--safe-b));gap:2px;flex-shrink:0}
.nav button{flex:1;border:none;background:transparent;font-size:10px;font-weight:600;color:var(--t3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;padding:6px 0}
.nav button.on{color:var(--t1);background:rgba(255,255,255,.06)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on svg{stroke-width:2.1}
.search-ov{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.search-ov.on{display:flex;flex-direction:column;justify-content:flex-end}
.search-box{background:var(--elev);border-radius:20px 20px 0 0;padding:16px;max-height:72vh;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:none}
.search-box input{width:100%;padding:14px 16px;border:none;border-radius:var(--r2);font-size:16px;background:var(--bg);color:var(--t1);outline:none;margin-bottom:12px}
.search-list{overflow-y:auto;flex:1}
.search-item{padding:14px 16px;border-radius:var(--r3);font-size:15px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between}
.search-item:active{background:var(--elev2)}
.search-item .sub{font-size:12px;color:var(--t3)}
.search-hint{font-size:12px;color:var(--t3);padding:4px 4px 12px;font-weight:500}
.ctx{display:none;position:fixed;z-index:150;background:var(--elev);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:160px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.ctx.on{display:block}
.ctx button{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--t1);padding:12px 14px;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer}
.ctx button:active{background:var(--elev2)}
.ctx .sub{font-size:11px;color:var(--t3);font-weight:500;margin-top:2px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(12px);background:var(--elev2);color:var(--t1);padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;border:1px solid var(--line2);max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="page on" id="pg-chart">
    <div class="hdr">
      <div class="hdr-row">
        <span class="sym" id="sym">BTCUSDT<i></i></span>
        <span class="price" id="last">—</span>
        <span class="chg" id="chg"></span>
        <span class="hdr-sp"></span>
        <button class="icon-btn" id="bTh" title="Theme">◐</button>
      </div>
      <div class="tf-row">
        <div class="tf" id="tfs"></div>
        <div class="togs">
          <button class="tog on" id="bS">S</button>
          <button class="tog on" id="bV">VP</button>
        </div>
      </div>
    </div>
    <div class="pos-bar" id="posBar">
      <span class="tag" id="posTag">LONG</span>
      <span class="meta" id="posMeta">—</span>
      <span class="pnl" id="posPnl">—</span>
      <button class="close-btn" id="posClose">Закрыть</button>
    </div>
    <div class="chart-wrap">
      <div id="chart"></div>
      <canvas id="ov"></canvas>
      <canvas id="vp"></canvas>
      <div class="st"><span class="conn wait" id="connDot"></span><span id="stTxt">…</span></div>
    </div>
    <div class="qbar" id="qbar">
      <div class="qsz" id="qsz">
        <button data-q="0.01" class="on">0.01</button>
        <button data-q="0.05">0.05</button>
        <button data-q="0.1">0.1</button>
        <button data-q="0.5">0.5</button>
      </div>
      <button class="qbuy" id="qBuy">BUY</button>
      <button class="qsell" id="qSell">SELL</button>
      <button class="qbe" id="qBE" title="Break-even">BE</button>
    </div>
    <div class="tools">
      <button class="on" id="tC">Cross</button>
      <button id="tL">Long</button>
      <button id="tSh">Short</button>
      <button id="tSL">SL</button>
      <button id="tTP">TP</button>
      <button id="tX">×</button>
    </div>
  </div>
  <div class="page" id="pg-screen">
    <div class="page-head"><div class="label">Рынки</div><h1>Screener</h1><p>Топ USDT за 24ч</p></div>
    <div class="filt"><button class="on" id="fG">Рост</button><button id="fL">Падение</button><button id="fV">Объём</button><button id="f3">±3%+</button><button id="f5">±5%+</button></div>
    <div style="padding:0 16px 8px"><input id="scrSearch" type="text" placeholder="Фильтр: BTC, ETH…" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--elev);color:var(--t1);font-size:15px;outline:none"/></div>
    <div class="list" id="scrList"></div>
  </div>
  <div class="page" id="pg-watch">
    <div class="page-head"><div class="label">Избранное</div><h1>Watchlist</h1></div>
    <div class="filt"><button class="on" id="wAdd">+ Добавить</button><button id="wClr">Очистить</button></div>
    <div class="list" id="watList"></div>
  </div>
  <div class="page" id="pg-trade">
    <div class="page-head"><div class="label">Ордер</div><h1 id="trSym">BTCUSDT</h1><p id="trPx">—</p></div>
    <div class="stats">
      <div class="stat"><div class="sl">Размер</div><div class="sv" id="stQty">0.01</div></div>
      <div class="stat"><div class="sl">Ордера</div><div class="sv" id="stOrd">0</div></div>
    </div>
    <div id="posCard" class="pos-card" style="display:none">
      <h3>Позиция</h3>
      <div class="pos-row"><span>Сторона</span><span id="pcSide">—</span></div>
      <div class="pos-row"><span>Вход</span><span id="pcEntry">—</span></div>
      <div class="pos-row"><span>Размер</span><span id="pcSize">—</span></div>
      <div class="pos-row"><span>uPnL</span><span id="pcPnl">—</span></div>
      <button class="close-btn" id="pcClose" style="width:100%;margin-top:8px;padding:12px">Закрыть по рынку</button>
    </div>
    <div class="trade-box">
      <div class="field"><label>Сторона</label><select id="trSide"><option value="BUY">Покупка</option><option value="SELL">Продажа</option></select></div>
      <div class="field"><label>Тип</label><select id="trType"><option value="MARKET">Market</option><option value="LIMIT">Limit</option></select></div>
      <div class="field"><label>Объём</label><input id="trQty" type="text" value="0.01" inputmode="decimal"/></div>
      <div class="field"><label>Цена</label><input id="trPrice" type="text" placeholder="Клик по графику" inputmode="decimal"/></div>
      <div class="sides"><button class="buy" id="trBuy">Купить</button><button class="sell" id="trSell">Продать</button></div>
      <p class="note">BUY/SELL — маркет. Long-press на графике — лимит/стоп. Тяни линии ордеров. BE — стоп в безубыток. Авто SL/TP при входе.</p>
      <div class="orders-box" id="trOrders"></div>
    </div>
  </div>
  <div class="nav">
    <button class="on" data-p="chart"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>График</button>
    <button data-p="screen"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Рынки</button>
    <button data-p="watch"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Список</button>
    <button data-p="trade"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Торговля</button>
  </div>
</div>
<div class="ctx" id="ctx"></div>
<div class="toast" id="toast"></div>
<div class="search-ov" id="searchOv">
  <div class="search-box">
    <div class="search-hint">Поиск · USDT</div>
    <input id="searchInp" type="text" placeholder="BTC, ETH, SOL…" autocomplete="off"/>
    <div class="search-list" id="searchList"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
