<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>AI Trading Terminal</title>
</head>
<body style="margin:0;background:#0a0a0f;color:#e5e7eb;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh">
<div id="st">Загрузка терминала…</div>
<script>
(async () => {
  const st = document.getElementById('st');
  try {
    const url = 'https://cdn.jsdelivr.net/gh/Romlya/ai-trading-terminal@0408968cf781eb7658e7fa190cb198bcf6a0b326/index.html';
    let html = await fetch(url).then(r => { if(!r.ok) throw new Error(r.status); return r.text(); });
    const mobileCss = `@media(max-width:768px){.main{flex-direction:column!important}.side{width:100%!important;height:40%!important;min-height:220px;border-left:none!important;border-top:1px solid}.chart-col{height:60%!important;min-height:200px}.tabs button{min-width:44px;padding:8px 2px;font-size:10px}.top{height:42px;padding:0 6px;gap:4px}.pane{padding:10px}}`;
    if (html.includes('</style>')) {
      html = html.replace('</style>', mobileCss + '\n</style>');
    }
    html = html.replace(/layout:\{background:\{color:T\.bg\},textColor:T\.tx2\}/g, 'layout:{background:{color:T.bg},textColor:T.tx2,attributionLogo:false}');
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    st.textContent = 'Ошибка: ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
