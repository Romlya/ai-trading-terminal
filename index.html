<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#000;--bg2:#0a0a0a;--card:#141414;--card2:#1a1a1a;--line:rgba(255,255,255,.06);--t1:#f5f5f5;--t2:#8a8a8a;--t3:#555;--green:#30d158;--red:#ff453a;--blue:#0a84ff;--amber:#ffd60a;--r:16px;--r2:12px;--r3:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1)}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;min-height:56px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.top::-webkit-scrollbar{display:none}
.sym{font-weight:700;font-size:17px;letter-spacing:-.3px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--t1)}
.sym::after{content:'';width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--t3);margin-top:2px}
.price{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.chg{font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px}
.chg.up{color:var(--green);background:rgba(48,209,88,.14)}.chg.dn{color:var(--red);background:rgba(255,69,58,.14)}
.up{color:var(--green)}.dn{color:var(--red)}
.tf{display:flex;gap:0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:3px;flex-shrink:0}
.tf button{border:none;background:transparent;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer}
.tf button.on{background:rgba(255,255,255,.1);color:var(--t1)}
.tog{border:1px solid var(--line);background:transparent;padding:7px 12px;border-radius:10px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer;margin-left:2px;flex-shrink:0}
.tog.on{background:rgba(10,132,255,.12);border-color:rgba(10,132,255,.35);color:var(--blue)}
.page{display:none;height:100%;overflow:hidden;flex-direction:column}.page.on{display:flex}
.chart-wrap{flex:1;position:relative;min-height:0;margin:0 8px;border-radius:var(--r);background:var(--bg2)}
#chart{width:100%;height:100%}
#ov,#vp{position:absolute;top:0;bottom:0;pointer-events:none}#ov{left:0;right:0;z-index:5}#vp{right:48px;width:52px;z-index:6}
.tools{display:flex;justify-content:center;gap:6px;padding:6px 12px 10px;overflow-x:auto}
.tools button{border:1px solid var(--line);background:rgba(255,255,255,.03);min-width:56px;height:38px;border-radius:12px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer}
.tools button.on{background:rgba(10,132,255,.14);border-color:rgba(10,132,255,.4);color:var(--blue)}
.st{position:absolute;left:12px;bottom:10px;font-size:10px;color:var(--t3);background:rgba(0,0,0,.7);padding:3px 8px;border-radius:6px;z-index:10}
.pos-bar{display:none;align-items:center;gap:10px;padding:8px 12px;margin:0 8px 4px;background:var(--card);border-radius:var(--r2);border:1px solid var(--line);font-size:12px}
.pos-bar.on{display:flex}
.pos-bar .tag{font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px}
.pos-bar .tag.long{background:rgba(48,209,88,.15);color:var(--green)}
.pos-bar .tag.short{background:rgba(255,69,58,.15);color:var(--red)}
.pos-bar .meta{color:var(--t2);flex:1;font-variant-numeric:tabular-nums}
.pos-bar .pnl{font-weight:700}
.pos-bar .close-btn,.pos-card .close-btn{border:none;background:var(--card2);color:var(--t1);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}
.page-head{padding:20px 20px 8px}.page-head .label{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.page-head h1{font-size:28px;font-weight:700}.page-head p{font-size:14px;color:var(--t2);margin-top:6px}
.filt{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto}
.filt button{border:1px solid var(--line);background:rgba(255,255,255,.03);padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;color:var(--t3);cursor:pointer;white-space:nowrap}
.filt button.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:var(--t1)}
.list{flex:1;overflow-y:auto;padding:0 12px 12px}
.row{display:flex;align-items:center;padding:14px 16px;margin-bottom:6px;background:var(--card);border-radius:var(--r2);cursor:pointer;gap:10px;border:1px solid var(--line)}
.row .n{font-weight:600;font-size:14px;min-width:80px}.row .p{flex:1;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.row .c{min-width:70px;text-align:right;font-size:13px;font-weight:600}
.row .c.up{color:var(--green)}.row .c.dn{color:var(--red)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin-right:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.stat{background:var(--card);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line)}
.stat .sl{font-size:10px;color:var(--t3);text-transform:uppercase;margin-bottom:6px}.stat .sv{font-size:20px;font-weight:600}
.trade-box{padding:8px 16px 20px;overflow-y:auto;flex:1}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--t3);text-transform:uppercase;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r2);font-size:15px;background:var(--card);color:var(--t1);outline:none}
.sides{display:flex;gap:10px;margin-top:8px}
.sides button{flex:1;padding:15px;border:none;border-radius:var(--r2);font-size:15px;font-weight:600;cursor:pointer;color:#fff}
.sides .buy{background:var(--green)}.sides .sell{background:var(--red)}
.note{font-size:12px;color:var(--t3);margin-top:16px;line-height:1.5;padding:12px 14px;background:var(--card);border-radius:var(--r2);border:1px solid var(--line)}
.orders-box{margin-top:16px}.orders-box h3{font-size:11px;color:var(--t3);text-transform:uppercase;margin-bottom:8px}
.order-item{padding:12px 14px;background:var(--card);border-radius:var(--r3);margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line)}
.pos-card{margin:0 12px 12px;padding:14px 16px;background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.pos-card h3{font-size:11px;color:var(--t3);text-transform:uppercase;margin-bottom:10px}
.pos-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}.pos-row span:first-child{color:var(--t3)}
.nav{display:flex;height:64px;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));gap:4px}
.nav button{flex:1;border:none;background:transparent;font-size:10px;font-weight:500;color:var(--t3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;padding:6px 0}
.nav button.on{color:var(--t1);background:rgba(255,255,255,.06)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on svg{stroke-width:2}
.search-ov{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.search-ov.on{display:flex;flex-direction:column;justify-content:flex-end}
.search-box{background:var(--card);border-radius:20px 20px 0 0;padding:16px;max-height:70vh;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:none}
.search-box input{width:100%;padding:14px 16px;border:none;border-radius:var(--r2);font-size:16px;background:var(--bg);color:var(--t1);outline:none;margin-bottom:12px}
.search-list{overflow-y:auto;flex:1}.search-item{padding:14px 16px;border-radius:var(--r3);font-size:15px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between}
.search-item:active{background:var(--card2)}.search-item .sub{font-size:12px;color:var(--t3)}.search-hint{font-size:12px;color:var(--t3);padding:8px 4px 12px}
.dom{position:absolute;right:104px;top:8px;bottom:8px;width:64px;z-index:7;pointer-events:none;font-size:9px;display:flex;flex-direction:column;justify-content:center;gap:1px;opacity:.85}
.dom div{display:flex;justify-content:space-between;padding:1px 3px;border-radius:2px;font-variant-numeric:tabular-nums}
.dom .a{background:rgba(255,69,58,.12);color:#ff453a}.dom .b{background:rgba(48,209,88,.12);color:#30d158}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--t1);padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;border:1px solid var(--line);max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.conn{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#555}
.conn.ok{background:var(--green)}.conn.bad{background:var(--red)}.conn.wait{background:var(--amber)}
@media(max-width:400px){.sym{font-size:15px}.tf button{padding:6px 9px;font-size:11px}.tools button{min-width:48px;font-size:11px;height:36px}.top{padding:8px 10px;gap:6px}}
</style></head><body>
<div id="app">
<div class="page on" id="pg-chart">
<div class="top"><span class="sym" id="sym">BTCUSDT</span><span class="price" id="last">—</span><span class="chg" id="chg"></span><div class="tf" id="tfs"></div><span style="flex:1"></span><button class="tog on" id="bS">Struct</button><button class="tog on" id="bV">VP</button><button class="tog" id="bTh">Theme</button></div>
<div class="pos-bar" id="posBar"><span class="tag" id="posTag">LONG</span><span class="meta" id="posMeta">—</span><span class="pnl" id="posPnl">—</span><button class="close-btn" id="posClose">Закрыть</button></div>
<div class="chart-wrap"><div id="chart"></div><canvas id="ov"></canvas><canvas id="vp"></canvas><div class="st" id="st"><span class="conn wait" id="connDot"></span><span id="stTxt">…</span></div><div class="dom" id="dom"></div></div>
<div class="tools"><button class="on" id="tC">Cross</button><button id="tL">Long</button><button id="tSh">Short</button><button id="tSL">SL</button><button id="tTP">TP</button><button id="tX">Clear</button></div>
</div>
<div class="page" id="pg-screen"><div class="page-head"><div class="label">Рынки</div><h1>Screener</h1><p>Топ USDT за 24ч</p></div><div class="filt"><button class="on" id="fG">Рост</button><button id="fL">Падение</button><button id="fV">Объём</button><button id="f3">±3%+</button><button id="f5">±5%+</button></div>
<div style="padding:0 16px 8px"><input id="scrSearch" type="text" placeholder="Фильтр: BTC, ETH…" style="width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--t1);font-size:14px;outline:none"/></div>
<div class="list" id="scrList"></div></div>
<div class="page" id="pg-watch"><div class="page-head"><div class="label">Избранное</div><h1>Watchlist</h1></div><div class="filt"><button class="on" id="wAdd">+ Добавить</button><button id="wClr">Очистить</button></div><div class="list" id="watList"></div></div>
<div class="page" id="pg-trade"><div class="page-head"><div class="label">Ордер</div><h1 id="trSym">BTCUSDT</h1><p id="trPx">—</p></div><div class="stats"><div class="stat"><div class="sl">Размер</div><div class="sv" id="stQty">0.01</div></div><div class="stat"><div class="sl">Ордера</div><div class="sv" id="stOrd">0</div></div></div>
<div id="posCard" class="pos-card" style="display:none"><h3>Позиция (бумага)</h3><div class="pos-row"><span>Сторона</span><span id="pcSide">—</span></div><div class="pos-row"><span>Вход</span><span id="pcEntry">—</span></div><div class="pos-row"><span>Размер</span><span id="pcSize">—</span></div><div class="pos-row"><span>uPnL</span><span id="pcPnl">—</span></div><button class="close-btn" id="pcClose" style="width:100%;margin-top:8px;padding:10px">Закрыть по рынку</button></div>
<div class="trade-box"><div class="field"><label>Сторона</label><select id="trSide"><option value="BUY">Покупка</option><option value="SELL">Продажа</option></select></div><div class="field"><label>Тип</label><select id="trType"><option value="MARKET">Market</option><option value="LIMIT">Limit</option></select></div><div class="field"><label>Объём</label><input id="trQty" type="text" value="0.01" inputmode="decimal"/></div><div class="field"><label>Цена</label><input id="trPrice" type="text" placeholder="Клик по графику" inputmode="decimal"/></div><div class="sides"><button class="buy" id="trBuy">Купить</button><button class="sell" id="trSell">Продать</button></div><p class="note">Бумага. Market — позиция. Limit — линия. Theme — светлый график.</p><div class="orders-box" id="trOrders"></div></div></div>
<div class="nav"><button class="on" data-p="chart"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>График</button><button data-p="screen"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Рынки</button><button data-p="watch"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Список</button><button data-p="trade"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Торговля</button></div>
</div>
<div class="toast" id="toast"></div>
<div class="search-ov" id="searchOv"><div class="search-box"><div class="search-hint">Поиск · USDT</div><input id="searchInp" type="text" placeholder="BTC, ETH…" autocomplete="off"/><div class="search-list" id="searchList"></div></div></div>
<script src="app.js"></script>
</body></html>
