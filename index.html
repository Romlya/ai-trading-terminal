<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>

<title>AI Trading Terminal</title>
<style>
body{margin:0;background:#0a0a0f;color:#e5e7eb;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

    <li>Theme → API Key / Secret, Testnet ON</li>
    <li>«Проверить аккаунт»</li>
