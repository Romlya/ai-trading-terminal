<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Chart Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#fff;color:#131722;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;width:100%}
.bar{display:flex;align-items:center;gap:10px;padding:6px 12px;height:44px;flex-shrink:0;border-bottom:1px solid #e0e3eb;background:#fff;overflow-x:auto}
.bar .sym{font-weight:700;font-size:15px}.bar .price{font-weight:600;font-size:15px}
.bar .chg{font-size:12px;font-weight:500}.bar .up{color:#089981}.bar .dn{color:#f23645}
.tf{display:flex;gap:2px}
.tf button{border:none;background:transparent;padding:5px 9px;border-radius:4px;font-size:12px;font-weight:500;color:#787b86;cursor:pointer}
.tf button.on{background:#2962ff;color:#fff}
.bar .spacer{flex:1}
.bar .btn{border:1px solid #e0e3eb;background:#fff;padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer}
.bar .btn.on{background:#2962ff;color:#fff;border-color:#2962ff}
.chart-wrap{flex:1;position:relative;min-height:0;background:#fff}
#chart{width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:5}
#vp-canvas{position:absolute;top:0;right:0;bottom:0;width:72px;pointer-events:none;z-index:6}
.tools{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 8px;height:48px;flex-shrink:0;border-top:1px solid #e0e3eb;background:#fff}
.tools button{border:none;background:transparent;width:42px;height:36px;border-radius:6px;font-size:11px;color:#787b86;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tools button.on{background:#e3f2fd;color:#2962ff}
.tools button .ic{font-size:16px;line-height:1}
.status{position:absolute;left:10px;bottom:10px;font-size:11px;color:#787b86;z-index:10;background:rgba(255,255,255,.85);padding:3px 8px;border-radius:4px}
@media(max-width:600px){.bar{padding:5px 8px;gap:6px}.tf button{padding:4px 7px;font-size:11px}#vp-canvas{width:56px}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="sym" id="sym">BTCUSDT</span>
    <span class="price" id="price">—</span>
    <span class="chg" id="chg"></span>
    <div class="tf" id="tfs"></div>
    <div class="spacer"></div>
    <button class="btn on" id="btnStruct">Struct</button>
    <button class="btn on" id="btnVP">VP</button>
    <button class="btn" id="btnTrade">Trade</button>
  </div>
  <div class="chart-wrap">
    <div id="chart"></div>
    <canvas id="overlay"></canvas>
    <canvas id="vp-canvas"></canvas>
    <div class="status" id="status">загрузка…</div>
  </div>
  <div class="tools">
    <button id="tCross" class="on"><span class="ic">✚</span>Cross</button>
    <button id="tLong"><span class="ic">▲</span>Long</button>
    <button id="tShort"><span class="ic">▼</span>Short</button>
    <button id="tSL"><span class="ic">⏹</span>SL</button>
    <button id="tTP"><span class="ic">🏁</span>TP</button>
    <button id="tClear"><span class="ic">✕</span>Clear</button>
  </div>
</div>
<script>
/* FULL APP LOADED FROM LOCAL - placeholder will be replaced */
document.getElementById('status').textContent='Deploying full version…';
</script>
</body>
</html>
