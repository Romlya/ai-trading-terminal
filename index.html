<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Terminal</title><script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script><style>
:root{--bg:#000;--bg2:#0a0a0a;--card:#141414;--card2:#1a1a1a;--line:rgba(255,255,255,.06);--t1:#f5f5f5;--t2:#8a8a8a;--t3:#555;--green:#30d158;--red:#ff453a;--blue:#0a84ff;--amber:#ffd60a;--r:16px;--r2:12px;--r3:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1)}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:52px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.sym{font-weight:600;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.sym::after{content:'▾';font-size:10px;color:var(--t3)}
.price{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.chg{font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px}
.chg.up{color:var(--green);background:rgba(48,209,88,.12)}.chg.dn{color:var(--red);background:rgba(255,69,58,.12)}
.up{color:var(--green)}.dn{color:var(--red)}
.tf{display:flex;gap:2px;background:var(--card);border-radius:20px;padding:2px}
.tf button{border:none;background:0;padding:5px 8px;border-radius:18px;font-size:11px;color:var(--t2);cursor:pointer}
.tf button.on{background:var(--card2);color:var(--t1)}
.tog{border:none;background:var(--card);padding:5px 10px;border-radius:20px;font-size:11px;color:var(--t2);cursor:pointer;margin-left:2px}
.tog.on{background:rgba(10,132,255,.15);color:var(--blue)}
.page{display:none;height:100%;overflow:hidden;flex-direction:column}.page.on{display:flex}
.chart-wrap{flex:1;position:relative;min-height:0;margin:0 8px;border-radius:var(--r);background:var(--bg2)}
#chart{width:100%;height:100%}
#ov,#vp{position:absolute;top:0;bottom:0;pointer-events:none}#ov{left:0;right:0;z-index:5}#vp{right:0;width:64px;z-index:6}
.tools{display:flex;justify-content:center;gap:3px;padding:8px;overflow-x:auto}
.tools button{border:none;background:var(--card);min-width:52px;height:36px;border-radius:20px;font-size:11px;color:var(--t2);cursor:pointer}
.tools button.on{background:rgba(10,132,255,.18);color:var(--blue)}
.st{position:absolute;left:12px;bottom:10px;font-size:10px;color:var(--t3);background:rgba(0,0,0,.7);padding:3px 8px;border-radius:6px;z-index:10}
.pos-bar{display:none;align-items:center;gap:10px;padding:8px 12px;margin:0 8px 4px;background:var(--card);border-radius:var(--r2);border:1px solid var(--line);font-size:12px}
.pos-bar.on{display:flex}
.pos-bar .tag{font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px}
.pos-bar .tag.long{background:rgba(48,209,88,.15);color:var(--green)}
.pos-bar .tag.short{background:rgba(255,69,58,.15);color:var(--red)}
.pos-bar .meta{color:var(--t2);flex:1;font-variant-numeric:tabular-nums}
.pos-bar .pnl{font-weight:700;font-variant-numeric:tabular-nums}
.pos-bar .close-btn,.pos-card .close-btn{border:none;background:var(--card2);color:var(--t1);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}
.page-head{padding:20px 20px 8px}.page-head .label{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.page-head h1{font-size:28px;font-weight:700}.page-head p{font-size:14px;color:var(--t2);margin-top:6px}
.filt{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto}
.filt button{border:none;background:var(--card);padding:8px 16px;border-radius:20px;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.filt button.on{background:#fff;color:#000}
.list{flex:1;overflow-y:auto;padding:0 12px 12px}
.row{display:flex;align-items:center;padding:14px 16px;margin-bottom:6px;background:var(--card);border-radius:var(--r2);cursor:pointer;gap:10px;border:1px solid var(--line)}
.row .n{font-weight:600;font-size:14px;min-width:80px}.row .p{flex:1;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.row .c{min-width:70px;text-align:right;font-size:13px;font-weight:600}
.row .c.up{color:var(--green)}.row .c.dn{color:var(--red)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin-right:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.stat{background:var(--card);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line)}
.stat .sl{font-size:10px;color:var(--t3);text-transform:uppercase;margin-bottom:6px}.stat .sv{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.trade-box{padding:8px 16px 20px;overflow-y:auto;flex:1}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--t3);text-transform:uppercase;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r2);font-size:15px;background:var(--card);color:var(--t1);outline:none}
.sides{display:flex;gap:10px;margin-top:8px}
.sides button{flex:1;padding:15px;border:none;border-radius:var(--r2);font-size:15px;font-weight:600;cursor:pointer;color:#fff}
.sides .buy{background:var(--green)}.sides .sell{background:var(--red)}
.note{font-size:12px;color:var(--t3);margin-top:16px;line-height:1.5;padding:12px 14px;background:var(--card);border-radius:var(--r2);border:1px solid var(--line)}
.orders-box{margin-top:16px}.orders-box h3{font-size:11px;color:var(--t3);text-transform:uppercase;margin-bottom:8px}
.order-item{padding:12px 14px;background:var(--card);border-radius:var(--r3);margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line)}
.pos-card{margin:0 12px 12px;padding:14px 16px;background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.pos-card h3{font-size:11px;color:var(--t3);text-transform:uppercase;margin-bottom:10px}
.pos-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}.pos-row span:first-child{color:var(--t3)}
.nav{display:flex;height:58px;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.nav button{flex:1;border:none;background:0;font-size:10px;color:var(--t3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button.on{color:var(--t1)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.search-ov{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.search-ov.on{display:flex;flex-direction:column;justify-content:flex-end}
.search-box{background:var(--card);border-radius:20px 20px 0 0;padding:16px;max-height:70vh;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:none}
.search-box input{width:100%;padding:14px 16px;border:none;border-radius:var(--r2);font-size:16px;background:var(--bg);color:var(--t1);outline:none;margin-bottom:12px}
.search-list{overflow-y:auto;flex:1}.search-item{padding:14px 16px;border-radius:var(--r3);font-size:15px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between}
.search-item:active{background:var(--card2)}.search-item .sub{font-size:12px;color:var(--t3)}.search-hint{font-size:12px;color:var(--t3);padding:8px 4px 12px}
.dom{position:absolute;right:68px;top:8px;bottom:8px;width:72px;z-index:7;pointer-events:none;font-size:9px;display:flex;flex-direction:column;justify-content:center;gap:1px;opacity:.9}
.dom div{display:flex;justify-content:space-between;padding:1px 3px;border-radius:2px;font-variant-numeric:tabular-nums}
.dom .a{background:rgba(255,69,58,.12);color:#ff453a}
.dom .b{background:rgba(48,209,88,.12);color:#30d158}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--t1);padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;border:1px solid var(--line);max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.conn{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#555}
.conn.ok{background:var(--green)}.conn.bad{background:var(--red)}.conn.wait{background:var(--amber)}
@media(max-width:400px){.sym{font-size:14px}.tf button{padding:4px 6px;font-size:10px}.tools button{min-width:44px;font-size:10px}}
</style></head><body>
<div id="app">
<div class="page on" id="pg-chart">
<div class="top"><span class="sym" id="sym">BTCUSDT</span><span class="price" id="last">—</span><span class="chg" id="chg"></span><div class="tf" id="tfs"></div><span style="flex:1"></span><button class="tog on" id="bS">Struct</button><button class="tog on" id="bV">VP</button></div>
<div class="pos-bar" id="posBar"><span class="tag" id="posTag">LONG</span><span class="meta" id="posMeta">—</span><span class="pnl" id="posPnl">—</span><button class="close-btn" id="posClose">Закрыть</button></div>
<div class="chart-wrap"><div id="chart"></div><canvas id="ov"></canvas><canvas id="vp"></canvas><div class="st" id="st"><span class="conn wait" id="connDot"></span><span id="stTxt">…</span></div><div class="dom" id="dom"></div></div>
<div class="tools"><button class="on" id="tC">Cross</button><button id="tL">Long</button><button id="tSh">Short</button><button id="tSL">SL</button><button id="tTP">TP</button><button id="tX">Clear</button></div>
</div>
<div class="page" id="pg-screen"><div class="page-head"><div class="label">Рынки</div><h1>Screener</h1><p>Топ USDT за 24ч</p></div><div class="filt"><button class="on" id="fG">Рост</button><button id="fL">Падение</button><button id="fV">Объём</button><button id="f3">±3%+</button><button id="f5">±5%+</button></div>
<div style="padding:0 16px 8px"><input id="scrSearch" type="text" placeholder="Фильтр: BTC, ETH…" style="width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--t1);font-size:14px;outline:none"/></div>
<div class="list" id="scrList"></div></div>
<div class="page" id="pg-watch"><div class="page-head"><div class="label">Избранное</div><h1>Watchlist</h1></div><div class="filt"><button class="on" id="wAdd">+ Добавить</button><button id="wClr">Очистить</button></div><div class="list" id="watList"></div></div>
<div class="page" id="pg-trade"><div class="page-head"><div class="label">Ордер</div><h1 id="trSym">BTCUSDT</h1><p id="trPx">—</p></div><div class="stats"><div class="stat"><div class="sl">Размер</div><div class="sv" id="stQty">0.01</div></div><div class="stat"><div class="sl">Ордера</div><div class="sv" id="stOrd">0</div></div></div>
<div id="posCard" class="pos-card" style="display:none"><h3>Позиция (бумага)</h3><div class="pos-row"><span>Сторона</span><span id="pcSide">—</span></div><div class="pos-row"><span>Вход</span><span id="pcEntry">—</span></div><div class="pos-row"><span>Размер</span><span id="pcSize">—</span></div><div class="pos-row"><span>uPnL</span><span id="pcPnl">—</span></div><button class="close-btn" id="pcClose" style="width:100%;margin-top:8px;padding:10px">Закрыть по рынку</button></div>
<div class="trade-box"><div class="field"><label>Сторона</label><select id="trSide"><option value="BUY">Покупка</option><option value="SELL">Продажа</option></select></div><div class="field"><label>Тип</label><select id="trType"><option value="MARKET">Market</option><option value="LIMIT">Limit</option></select></div><div class="field"><label>Объём</label><input id="trQty" type="text" value="0.01" inputmode="decimal"/></div><div class="field"><label>Цена</label><input id="trPrice" type="text" placeholder="Клик по графику" inputmode="decimal"/></div><div class="sides"><button class="buy" id="trBuy">Купить</button><button class="sell" id="trSell">Продать</button></div><p class="note">Бумага. Market — позиция. Limit — линия. SL/TP повторный клик = перенос.</p><div class="orders-box" id="trOrders"></div></div></div>
<div class="nav"><button class="on" data-p="chart"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>График</button><button data-p="screen"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Рынки</button><button data-p="watch"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Список</button><button data-p="trade"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Торговля</button></div>
</div>
<div class="toast" id="toast"></div>
<div class="search-ov" id="searchOv"><div class="search-box"><div class="search-hint">Поиск · USDT</div><input id="searchInp" type="text" placeholder="BTC, ETH…" autocomplete="off"/><div class="search-list" id="searchList"></div></div></div>
<script>
const REST=['https://data-api.binance.vision','https://api.binance.com'];
const WS=['wss://data-stream.binance.vision','wss://stream.binance.com:9443'];
const TFS=['1m','5m','15m','1h','4h','1d'];
const POPULAR=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','AVAXUSDT','DOTUSDT','LINKUSDT','LTCUSDT','ATOMUSDT','UNIUSDT','NEARUSDT','APTUSDT','ARBUSDT','OPUSDT','SUIUSDT','PEPEUSDT','WIFUSDT'];
let symbol='BTCUSDT',tf='15m',bars=[],chart,series,volS,ws;
let showS=true,showV=true,tradeMode=false,tool='cross',orders=[],_oid=1,position=null;
let watch=JSON.parse(localStorage.getItem('tt_watch')||'["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT"]');
const _cfg=JSON.parse(localStorage.getItem('tt_cfg')||'{}');
if(_cfg.tf) tf=_cfg.tf;
if(typeof _cfg.showS==='boolean') showS=_cfg.showS;
if(typeof _cfg.showV==='boolean') showV=_cfg.showV;
function saveCfg(){localStorage.setItem('tt_cfg',JSON.stringify({tf,showS,showV}))}
let tickers=[];
const $=id=>document.getElementById(id);
let _toastT=null;
function toast(msg){const el=$('toast');if(!el)return;el.textContent=msg;el.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('on'),1800)}
function setConn(s){const c=$('connDot');if(c){c.className='conn '+s}}
const st=t=>{const el=$('stTxt');if(el)el.textContent=t};
const fmt=v=>v==null?'—':v>=1000?v.toFixed(1):v>=1?v.toFixed(2):v.toFixed(5);
const saveWatch=()=>localStorage.setItem('tt_watch',JSON.stringify(watch));
const qty=()=>{const q=parseFloat($('trQty').value);return(isFinite(q)&&q>0)?q:0.01};
const lastPx=()=>bars.length?bars[bars.length-1].close:null;
document.querySelectorAll('.nav button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('pg-'+b.dataset.p).classList.add('on');if(b.dataset.p==='chart'){const fix=()=>{const el=$('chart');if(!el||!chart)return;const w=el.clientWidth,h=el.clientHeight;if(w&&h){chart.applyOptions({width:w,height:h});resize();draw()}};requestAnimationFrame(()=>{fix();setTimeout(fix,50);setTimeout(fix,200)})}if(b.dataset.p==='screen')loadTickers();if(b.dataset.p==='watch')renderWatch();if(b.dataset.p==='trade')renderTrade()}});
async function load(){st('загрузка…');setConn('wait');for(let attempt=0;attempt<3;attempt++){for(const b of REST){try{const r=await fetch(b+'/api/v3/klines?symbol='+symbol+'&interval='+tf+'&limit=250',{cache:'no-store'});if(!r.ok)continue;const raw=await r.json();if(!Array.isArray(raw))continue;bars=raw.map(k=>({time:k[0]/1000|0,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));setConn('ok');return true}catch(e){}}if(attempt<2)await new Promise(r=>setTimeout(r,600*(attempt+1)))}st('ошибка сети');setConn('bad');toast('Нет связи с биржей');return false}
function wsConn(){if(ws)try{ws.close()}catch(e){}const s=symbol.toLowerCase()+'@kline_'+tf;let i=0;(function c(){if(i>=WS.length)return;try{ws=new WebSocket(WS[i++]+'/ws/'+s);ws.onopen=()=>setConn('ok');ws.onmessage=e=>{try{const k=JSON.parse(e.data).k;const bar={time:k.t/1000|0,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};if(series)series.update(bar);if(volS)volS.update({time:bar.time,value:bar.volume,color:bar.close>=bar.open?'rgba(48,209,88,.3)':'rgba(255,69,58,.3)'});const L=bars[bars.length-1];if(L&&L.time===bar.time)bars[bars.length-1]=bar;else bars.push(bar);if(bars.length>300)bars.shift();$('last').textContent=fmt(bar.close);updatePosUI();tryFillLimits(bar.close);draw()}catch(x){}};ws.onerror=()=>{setConn('bad');try{ws.close()}catch(x){}c()};ws.onclose=()=>{setConn('wait')}}catch(x){c()}})()}
function openPosition(side,price,size){position={side,entry:price,size,qty:size};st((side==='long'?'Long':'Short')+' @ '+fmt(price)+' × '+size);toast((side==='long'?'Long':'Short')+' × '+size);updatePosUI();renderTrade();draw()}
function closePosition(){if(!position)return;const px=lastPx();if(px!=null){const pnl=position.side==='long'?(px-position.entry)*position.size:(position.entry-px)*position.size;st('закрыто PnL '+pnl.toFixed(2));toast('Закрыто · '+pnl.toFixed(2))}position=null;updatePosUI();renderTrade();draw()}
function updatePosUI(){const bar=$('posBar');if(!position){bar.classList.remove('on');return}bar.classList.add('on');const tag=$('posTag');tag.textContent=position.side==='long'?'LONG':'SHORT';tag.className='tag '+(position.side==='long'?'long':'short');$('posMeta').textContent=fmt(position.entry)+' × '+position.size;const px=lastPx();if(px!=null){const pnl=position.side==='long'?(px-position.entry)*position.size:(position.entry-px)*position.size;const el=$('posPnl');el.textContent=(pnl>=0?'+':'')+pnl.toFixed(2);el.className='pnl '+(pnl>=0?'up':'dn')}}
function tryFillLimits(px){const left=[];for(const o of orders){if(o.type!=='limit'){left.push(o);continue}let fill=false;if(o.side==='buy'&&px<=o.price)fill=true;if(o.side==='sell'&&px>=o.price)fill=true;if(fill)openPosition(o.side==='buy'?'long':'short',o.price,o.qty||qty());else left.push(o)}if(left.length!==orders.length){orders=left;renderTrade()}}
let depthTimer=null;
async function loadDepth(){const el=$('dom');if(!el)return;for(const b of REST){try{const r=await fetch(b+'/api/v3/depth?symbol='+symbol+'&limit=8',{cache:'no-store'});if(!r.ok)continue;const d=await r.json();if(!d.bids||!d.asks)continue;const asks=d.asks.slice(0,6).reverse();const bids=d.bids.slice(0,6);el.innerHTML=asks.map(a=>'<div class="a"><span>'+fmt(+a[0])+'</span><span>'+(+a[1]>1?(+a[1]).toFixed(2):(+a[1]).toFixed(4))+'</span></div>').join('')+'<div style="height:4px"></div>'+bids.map(b=>'<div class="b"><span>'+fmt(+b[0])+'</span><span>'+(+b[1]>1?(+b[1]).toFixed(2):(+b[1]).toFixed(4))+'</span></div>').join('');return}catch(e){}}}
function startDepth(){if(depthTimer)clearInterval(depthTimer);loadDepth();depthTimer=setInterval(loadDepth,2500)}
function initChart(){const el=$('chart');chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0a0a0a'},textColor:'#555',attributionLogo:false},grid:{vertLines:{color:'#141414'},horzLines:{color:'#141414'}},rightPriceScale:{borderColor:'#1a1a1a',scaleMargins:{top:.04,bottom:.1},textColor:'#555'},timeScale:{borderColor:'#1a1a1a',timeVisible:true,textColor:'#444'},crosshair:{mode:0,vertLine:{color:'#333',labelBackgroundColor:'#0a84ff'},horzLine:{color:'#333',labelBackgroundColor:'#0a84ff'}},handleScroll:true,handleScale:true});series=chart.addCandlestickSeries({upColor:'#30d158',downColor:'#ff453a',borderUpColor:'#30d158',borderDownColor:'#ff453a',wickUpColor:'#30d158',wickDownColor:'#ff453a'});volS=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',scaleMargins:{top:.9,bottom:0}});new ResizeObserver(()=>{if(!el.clientWidth)return;chart.applyOptions({width:el.clientWidth,height:el.clientHeight});resize();draw()}).observe(el);chart.subscribeClick(p=>{if(!p.point)return;const price=series.coordinateToPrice(p.point.y);if(price==null)return;$('trPrice').value=String(+price.toFixed(price>=1000?1:price>=1?2:5));if(tool==='cross'||!tradeMode){const hit=orders.find(o=>Math.abs(o.price-price)/Math.max(price,1)<0.0015);if(hit){orders=orders.filter(o=>o.id!==hit.id);st('удалён');toast('Ордер удалён');draw();renderTrade();return}if(!tradeMode){st('цена '+fmt(price));return}}if(!tradeMode)return;const q=qty();const type=$('trType').value||'LIMIT';if(tool==='long'){if(type==='MARKET')openPosition('long',lastPx()||price,q);else{orders.push({id:_oid++,type:'limit',side:'buy',price:+price,qty:q});st('Buy limit @ '+fmt(price)+' × '+q)}}if(tool==='short'){if(type==='MARKET')openPosition('short',lastPx()||price,q);else{orders.push({id:_oid++,type:'limit',side:'sell',price:+price,qty:q});st('Sell limit @ '+fmt(price)+' × '+q)}}if(tool==='sl'||tool==='tp'){const exist=orders.find(o=>o.type===tool);if(exist){exist.price=+price;st(tool.toUpperCase()+' → '+fmt(price))}else{orders.push({id:_oid++,type:tool,price:+price,qty:q});st(tool.toUpperCase()+' @ '+fmt(price))}}draw();renderTrade()});chart.timeScale().subscribeVisibleLogicalRangeChange(()=>draw())}
function setData(){series.setData(bars.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));volS.setData(bars.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(48,209,88,.25)':'rgba(255,69,58,.25)'})));const last=bars[bars.length-1].close;$('last').textContent=fmt(last);const o=bars[0].open,ch=((last-o)/o)*100;const el=$('chg');el.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';el.className='chg '+(ch>=0?'up':'dn');$('sym').textContent=symbol;chart.timeScale().fitContent();st(symbol+' · '+tf);updatePosUI();resize();setTimeout(()=>{resize();draw()},80)}
function struct(d){const z=[],sw=[];const lb=8;for(let i=lb;i<d.length-lb;i++){let h=1,l=1;for(let k=1;k<=lb;k++){if(d[i-k].high>=d[i].high||d[i+k].high>d[i].high)h=0;if(d[i-k].low<=d[i].low||d[i+k].low<d[i].low)l=0}if(h)sw.push({t:d[i].time,p:d[i].high,ty:'h'});if(l)sw.push({t:d[i].time,p:d[i].low,ty:'l'})}for(let i=6;i<d.length-6;i++){const c=d[i],body=Math.abs(c.close-c.open),rng=c.high-c.low;if(rng<=0||body/rng<.6)continue;const n=d.slice(i+1,i+8);if(c.close>c.open&&n.filter(x=>x.low>c.high).length>=4)z.push({top:c.open,bot:c.low,t:c.time,ty:'d'});if(c.close<c.open&&n.filter(x=>x.high<c.low).length>=4)z.push({top:c.high,bot:c.open,t:c.time,ty:'s'})}for(let i=3;i<d.length;i++){const gapB=(d[i].low-d[i-2].high)/d[i].low;const gapS=(d[i-2].low-d[i].high)/d[i].high;if(d[i-2].high<d[i].low&&gapB>0.0012)z.push({top:d[i].low,bot:d[i-2].high,t:d[i-2].time,ty:'fb'});if(d[i-2].low>d[i].high&&gapS>0.0012)z.push({top:d[i-2].low,bot:d[i].high,t:d[i-2].time,ty:'fs'})}const uniq=[];for(const x of z.slice().reverse()){if(uniq.length>=5)break;const ht=Math.abs(x.top-x.bot)/Math.max(x.top,1);if(ht<0.0004)continue;if(!uniq.some(u=>Math.abs(u.top-x.top)/Math.max(x.top,1)<0.003))uniq.push(x)}const sl=d.slice(-80);return{z:uniq.reverse(),sw:sw.slice(-6),max:Math.max(...sl.map(x=>x.high)),min:Math.min(...sl.map(x=>x.low))}}
function vp(d,bins=28){let s=d.slice(-100);try{const r=chart&&chart.timeScale().getVisibleLogicalRange();if(r&&d.length){const from=Math.max(0,Math.floor(r.from));const to=Math.min(d.length-1,Math.ceil(r.to));if(to>from)s=d.slice(from,to+1)}}catch(e){}if(!s.length)return{bins:[],poc:null};let lo=Math.min(...s.map(x=>x.low)),hi=Math.max(...s.map(x=>x.high));if(hi<=lo)return{bins:[],poc:null};const step=(hi-lo)/bins;const h=Array.from({length:bins},(_,i)=>({p:lo+(i+.5)*step,v:0,b:0,s:0}));for(const c of s){let i=Math.floor(((c.high+c.low)/2-lo)/step);if(i<0)i=0;if(i>=bins)i=bins-1;h[i].v+=c.volume;if(c.close>=c.open)h[i].b+=c.volume;else h[i].s+=c.volume}const m=Math.max(...h.map(x=>x.v),1);const poc=h.reduce((a,b)=>b.v>a.v?b:a,h[0]);return{bins:h.map(x=>({...x,r:x.v/m})),poc}}
function resize(){const wrap=$('chart').parentElement;if(!wrap)return;const W=wrap.clientWidth||1,H=wrap.clientHeight||1;$('ov').width=W;$('ov').height=H;$('vp').width=64;$('vp').height=H}
function draw(){if(!chart||!series||!bars.length)return;const c=$('ov').getContext('2d'),w=$('ov').width,h=$('ov').height;if(!w||!h)return;c.clearRect(0,0,w,h);const ts=chart.timeScale();const vpW=64;if(showS){const S=struct(bars);for(const z of S.z){let x1=ts.timeToCoordinate(z.t);if(x1==null)x1=0;const y1=series.priceToCoordinate(z.top),y2=series.priceToCoordinate(z.bot);if(y1==null||y2==null)continue;const top=Math.min(y1,y2),ht=Math.abs(y2-y1);if(ht<3)continue;c.fillStyle=z.ty==='d'||z.ty==='fb'?'rgba(48,209,88,.1)':'rgba(255,69,58,.08)';c.fillRect(x1,top,Math.max(24,w-vpW-2-x1),ht);c.strokeStyle=z.ty==='d'||z.ty==='fb'?'rgba(48,209,88,.25)':'rgba(255,69,58,.2)';c.lineWidth=1;c.strokeRect(x1,top,Math.max(24,w-vpW-2-x1),ht)}for(const s of S.sw){const x=ts.timeToCoordinate(s.t),y=series.priceToCoordinate(s.p);if(x==null||y==null)continue;c.fillStyle=s.ty==='h'?'#ff453a':'#30d158';c.beginPath();if(s.ty==='h'){c.moveTo(x,y-5);c.lineTo(x-3.5,y);c.lineTo(x+3.5,y)}else{c.moveTo(x,y+5);c.lineTo(x-3.5,y);c.lineTo(x+3.5,y)}c.fill()}if(S.max!=null){const y=series.priceToCoordinate(S.max);if(y!=null){c.strokeStyle='rgba(255,69,58,.35)';c.setLineDash([4,3]);c.lineWidth=1;c.beginPath();c.moveTo(0,y);c.lineTo(w-vpW,y);c.stroke();c.setLineDash([]);c.fillStyle='#ff453a';c.font='bold 10px system-ui';c.fillText('Max '+fmt(S.max),4,y+3)}}if(S.min!=null){const y=series.priceToCoordinate(S.min);if(y!=null){c.strokeStyle='rgba(48,209,88,.35)';c.setLineDash([4,3]);c.lineWidth=1;c.beginPath();c.moveTo(0,y);c.lineTo(w-vpW,y);c.stroke();c.setLineDash([]);c.fillStyle='#30d158';c.font='bold 10px system-ui';c.fillText('Min '+fmt(S.min),4,y+3)}}}if(position){const y=series.priceToCoordinate(position.entry);if(y!=null){c.strokeStyle=position.side==='long'?'#30d158':'#ff453a';c.setLineDash([6,3]);c.lineWidth=1.5;c.beginPath();c.moveTo(0,y);c.lineTo(w-vpW,y);c.stroke();c.setLineDash([]);c.fillStyle=c.strokeStyle;c.font='bold 10px system-ui';c.fillText((position.side==='long'?'Long':'Short')+' '+fmt(position.entry)+' ×'+position.size,6,y-4)}}for(const o of orders){const y=series.priceToCoordinate(o.price);if(y==null)continue;c.strokeStyle=o.type==='tp'||o.side==='buy'?'#30d158':'#ff453a';c.setLineDash(o.type==='limit'?[]:[4,3]);c.lineWidth=1.5;c.beginPath();c.moveTo(0,y);c.lineTo(w-vpW,y);c.stroke();c.setLineDash([]);const qstr=o.qty?(' ×'+o.qty):'';const label=(o.type==='sl'?'SL ':o.type==='tp'?'TP ':o.side==='buy'?'Buy ':'Sell ')+fmt(o.price)+qstr;c.font='bold 10px system-ui';const tw=c.measureText(label+'  ×').width+10;c.fillStyle='rgba(0,0,0,.75)';c.fillRect(4,y-14,tw,16);c.fillStyle=c.strokeStyle;c.fillText(label,8,y-3);c.fillStyle='#888';c.fillText('×',8+c.measureText(label+' ').width,y-3)}const vc=$('vp').getContext('2d');vc.clearRect(0,0,64,h);if(showV){const V=vp(bars);vc.fillStyle='rgba(10,10,10,.9)';vc.fillRect(0,0,64,h);for(const b of V.bins){const y=series.priceToCoordinate(b.p);if(y==null)continue;const bw=Math.max(2,b.r*56),bh=Math.max(3,h/V.bins.length*.75);const buyW=bw*(b.b/(b.v||1));vc.fillStyle='rgba(48,209,88,.55)';vc.fillRect(62-bw,y-bh/2,buyW,bh);vc.fillStyle='rgba(255,69,58,.5)';vc.fillRect(62-bw+buyW,y-bh/2,bw-buyW,bh)}if(V.poc){const y=series.priceToCoordinate(V.poc.p);if(y!=null){vc.strokeStyle='#0a84ff';vc.lineWidth=1.5;vc.setLineDash([3,2]);vc.beginPath();vc.moveTo(0,y);vc.lineTo(64,y);vc.stroke();vc.setLineDash([]);vc.fillStyle='#0a84ff';vc.font='9px system-ui';vc.fillText('POC',3,y-3)}}}}
async function loadTickers(){$('scrList').innerHTML='<div style="padding:40px;text-align:center;color:var(--t3)">Загрузка…</div>';for(const b of REST){try{const r=await fetch(b+'/api/v3/ticker/24hr',{cache:'no-store'});if(!r.ok)continue;const data=await r.json();if(!Array.isArray(data))continue;tickers=data.filter(t=>t.symbol.endsWith('USDT')&&!t.symbol.includes('_')&&+t.quoteVolume>1e6);renderScreen('gain');return}catch(e){}}$('scrList').innerHTML='<div style="padding:40px;text-align:center;color:var(--red)">Ошибка</div>'}
let scrMode='gain';let scrMinPct=0,scrQ='';
function renderScreen(mode){if(mode)scrMode=mode;document.querySelectorAll('#pg-screen .filt button').forEach(b=>b.classList.remove('on'));if(scrMode==='gain')$('fG').classList.add('on');if(scrMode==='lose')$('fL').classList.add('on');if(scrMode==='vol')$('fV').classList.add('on');if(scrMinPct===3)$('f3').classList.add('on');if(scrMinPct===5)$('f5').classList.add('on');let list=[...tickers];if(scrMinPct>0)list=list.filter(t=>Math.abs(+t.priceChangePercent)>=scrMinPct);if(scrQ){const q=scrQ.toUpperCase();list=list.filter(t=>t.symbol.includes(q))}if(scrMode==='gain')list.sort((a,b)=>+b.priceChangePercent-+a.priceChangePercent);if(scrMode==='lose')list.sort((a,b)=>+a.priceChangePercent-+b.priceChangePercent);if(scrMode==='vol')list.sort((a,b)=>+b.quoteVolume-+a.quoteVolume);$('scrList').innerHTML=list.slice(0,60).map(t=>{const ch=+t.priceChangePercent;const inW=watch.includes(t.symbol);return '<div class="row" data-s="'+t.symbol+'"><span class="n">'+(inW?'★ ':'')+t.symbol.replace('USDT','')+'</span><span class="p">'+fmt(+t.lastPrice)+'</span><span class="c '+(ch>=0?'up':'dn')+'">'+(ch>=0?'+':'')+ch.toFixed(2)+'%</span></div>'}).join('')||'<div style="padding:40px;text-align:center;color:var(--t3)">Нет совпадений</div>';$('scrList').querySelectorAll('.row').forEach(r=>{r.onclick=()=>{symbol=r.dataset.s;switchToChart()};r.ondblclick=e=>{e.preventDefault();if(!watch.includes(r.dataset.s)){watch.unshift(r.dataset.s);saveWatch()}}})}
$('fG').onclick=()=>renderScreen('gain');$('fL').onclick=()=>renderScreen('lose');$('fV').onclick=()=>renderScreen('vol');
$('f3').onclick=()=>{scrMinPct=scrMinPct===3?0:3;renderScreen()};$('f5').onclick=()=>{scrMinPct=scrMinPct===5?0:5;renderScreen()};
setTimeout(()=>{const inp=$('scrSearch');if(inp)inp.oninput=function(){scrQ=this.value.trim();renderScreen()}},0);
function renderWatch(){if(!tickers.length){loadTickers().then(()=>renderWatch());return}const map={};tickers.forEach(t=>map[t.symbol]=t);$('watList').innerHTML=watch.map(s=>{const t=map[s];const ch=t?+t.priceChangePercent:null;const price=t?fmt(+t.lastPrice):'—';const chStr=ch==null?'—':((ch>=0?'+':'')+ch.toFixed(2)+'%');const chCls=ch==null?'':(ch>=0?'up':'dn');return '<div class="row" data-s="'+s+'"><span class="n"><span class="dot"></span>'+s.replace('USDT','')+'</span><span class="p">'+price+'</span><span class="c '+chCls+'">'+chStr+'</span><span class="wdel" data-del="'+s+'" style="margin-left:8px;color:var(--t3);font-size:18px;padding:4px 8px">×</span></div>'}).join('')||'<div style="padding:40px;text-align:center;color:var(--t3)">Пусто</div>';$('watList').querySelectorAll('.row').forEach(r=>{r.onclick=e=>{if(e.target.classList.contains('wdel')){e.stopPropagation();watch=watch.filter(x=>x!==e.target.dataset.del);saveWatch();renderWatch();return}symbol=r.dataset.s;switchToChart()}})}
$('wAdd').onclick=()=>{if(!watch.includes(symbol)){watch.unshift(symbol);saveWatch();renderWatch()}};$('wClr').onclick=()=>{watch=[];saveWatch();renderWatch()};
function openSearch(){$('searchOv').classList.add('on');const inp=$('searchInp');inp.value='';renderSearchList('');setTimeout(()=>inp.focus(),50);if(!tickers.length)loadTickers()}
function closeSearch(){$('searchOv').classList.remove('on')}
function renderSearchList(q){q=(q||'').trim().toUpperCase().replace(/USDT$/,'');let list=tickers.length?tickers.map(t=>t.symbol).filter(s=>s.endsWith('USDT')):POPULAR.slice();if(q){list=list.filter(s=>s.replace('USDT','').includes(q)||s.includes(q));if(q.length>=2&&!list.some(s=>s.replace('USDT','')===q))list.unshift(q+'USDT')}else{const set=new Set(watch.concat(POPULAR));list=[...set].slice(0,30);if(!list.length)list=POPULAR.slice()}list=list.slice(0,40);$('searchList').innerHTML=list.map(s=>{const base=s.replace('USDT','');const t=tickers.find(x=>x.symbol===s);const sub=t?(fmt(+t.lastPrice)+' · '+(+t.priceChangePercent>=0?'+':'')+(+t.priceChangePercent).toFixed(2)+'%'):'USDT';return '<div class="search-item" data-s="'+s+'"><span>'+base+'</span><span class="sub">'+sub+'</span></div>'}).join('')||'<div style="padding:20px;text-align:center;color:var(--t3)">Пусто</div>';$('searchList').querySelectorAll('.search-item').forEach(el=>{el.onclick=()=>{symbol=el.dataset.s;closeSearch();switchToChart()}})}
$('sym').onclick=openSearch;$('searchOv').onclick=function(e){if(e.target===this)closeSearch()};$('searchInp').oninput=function(){renderSearchList(this.value)};$('searchInp').onkeydown=function(e){if(e.key==='Enter'){const q=this.value.trim().toUpperCase().replace(/USDT$/,'');if(q.length>=1){symbol=q+'USDT';closeSearch();switchToChart()}}if(e.key==='Escape')closeSearch()};
function renderTrade(){$('trSym').textContent=symbol;$('trPx').textContent=bars.length?fmt(bars[bars.length-1].close):'—';$('stQty').textContent=$('trQty').value||'0.01';$('stOrd').textContent=orders.length;const card=$('posCard');if(position){card.style.display='block';$('pcSide').textContent=position.side==='long'?'Long':'Short';$('pcSide').className=position.side==='long'?'up':'dn';$('pcEntry').textContent=fmt(position.entry);$('pcSize').textContent=String(position.size);const px=lastPx();if(px!=null){const pnl=position.side==='long'?(px-position.entry)*position.size:(position.entry-px)*position.size;$('pcPnl').textContent=(pnl>=0?'+':'')+pnl.toFixed(2);$('pcPnl').className=pnl>=0?'up':'dn'}}else card.style.display='none';const box=$('trOrders');if(!orders.length){box.innerHTML='';return}box.innerHTML='<h3>Ордера</h3>'+orders.map(o=>'<div class="order-item"><span>'+o.type.toUpperCase()+' '+(o.side||'')+' · '+fmt(o.price)+(o.qty?' ×'+o.qty:'')+'</span><span class="odel" data-oid="'+o.id+'" style="color:var(--t3);font-size:18px;padding:0 6px">×</span></div>').join('');box.querySelectorAll('.odel').forEach(el=>{el.onclick=e=>{e.stopPropagation();orders=orders.filter(o=>o.id!==+el.dataset.oid);draw();renderTrade()}})}
function placeFromPanel(side){const type=$('trType').value||'MARKET';const q=qty();let price=parseFloat($('trPrice').value);if(!isFinite(price))price=lastPx();if(price==null)return;if(type==='MARKET')openPosition(side==='BUY'?'long':'short',lastPx()||price,q);else{orders.push({id:_oid++,type:'limit',side:side==='BUY'?'buy':'sell',price:+price,qty:q});st((side==='BUY'?'Buy':'Sell')+' limit @ '+fmt(price)+' × '+q);draw();renderTrade()}}
$('trBuy').onclick=()=>placeFromPanel('BUY');$('trSell').onclick=()=>placeFromPanel('SELL');$('trQty').oninput=()=>$('stQty').textContent=$('trQty').value||'0';$('posClose').onclick=closePosition;$('pcClose').onclick=closePosition;
function switchToChart(){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.querySelector('.nav button[data-p="chart"]').classList.add('on');$('pg-chart').classList.add('on');go()}
function uiChart(){const box=$('tfs');box.innerHTML='';TFS.forEach(t=>{const b=document.createElement('button');b.textContent=t;if(t===tf)b.className='on';b.onclick=()=>{tf=t;saveCfg();uiChart();go()};box.appendChild(b)});$('bS').onclick=function(){showS=!showS;this.classList.toggle('on',showS);saveCfg();draw()};$('bV').onclick=function(){showV=!showV;this.classList.toggle('on',showV);saveCfg();draw()};const map={tC:'cross',tL:'long',tSh:'short',tSL:'sl',tTP:'tp'};Object.keys(map).forEach(id=>{$(id).onclick=function(){tool=map[id];tradeMode=(tool!=='cross');document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('on'));this.classList.add('on');st(tool==='cross'?'клик = цена / ордер = удалить':tool+' · '+qty())}});$('tX').onclick=()=>{orders=[];draw();st('cleared');renderTrade()}}
async function go(){if(await load()){setData();wsConn();startDepth()}}
uiChart();if(!showS)$('bS').classList.remove('on');if(!showV)$('bV').classList.remove('on');initChart();resize();go();setInterval(()=>{draw();updatePosUI()},800);
</script></body></html>
