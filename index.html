<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>AI Trading Terminal</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Romlya/ai-trading-terminal@main/styles.css"/>
</head>
<body>
<div id="root"></div>
<script>
(async function(){
  try {
    var base = 'https://cdn.jsdelivr.net/gh/Romlya/ai-trading-terminal@main/';
    var parts = await Promise.all([1,2,3,4,5,6].map(function(i){
      return fetch(base+'app.p'+i+'.txt?t='+Date.now()).then(function(r){ if(!r.ok) throw new Error('p'+i+' '+r.status); return r.text(); });
    }));
    var code = Babel.transform(parts.join(''), { presets: ['react'] }).code;
    eval(code);
  } catch (e) {
    document.getElementById('root').innerHTML = '<div style="color:#f87171;padding:24px;font-family:system-ui">Load error: '+e.message+'</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
