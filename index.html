<style>

.ls{flex:1;overflow-y:auto;padding:0 10px 10px}.rw{display:flex;align-items:center;padding:12px;margin-bottom:5px;background:var(--e);border-radius:11px;gap:8px;border:1px solid var(--l)}.rw .n{font-weight:600;font-size:13px;min-width:64px}.rw .p{flex:1;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}.rw .c{min-width:56px;text-align:right;font-size:12px;font-weight:600}.rw .c.up{color:var(--g)}.rw .c.dn{color:var(--r)}

<button data-p="E"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>Ещё</button>

<script>
const R=['https://data-api.binance.vision','https://api.binance.com'],W=['wss://data-stream.binance.vision','wss://stream.binance.com:9443'],TF=['1m','5m','15m','1h','4h','1d'];
let sym='BTCUSDT',tf='15m',bars=[],chart,series,volS,ws,showS=1,showV=1,q=0.01,pos=null,ords=[],oid=1,tks=[];
const $=id=>document.getElementById(id),fmt=v=>v==null?'—':v>=1000?v.toFixed(1):v>=1?v.toFixed(2):v.toFixed(5);
const last=()=>bars.length?bars[bars.length-1].close:null;
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1600)}
function st(t){$('st').textContent=t}
document.querySelectorAll('.nav button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.pg').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('p'+b.dataset.p).classList.add('on');if(b.dataset.p==='C'&&chart){const el=$('ch');chart.applyOptions({width:el.clientWidth,height:el.clientHeight});rz();dr()}if(b.dataset.p==='M')ldT();if(b.dataset.p==='W')rW()}});
async function ld(){st('загрузка…');for(const b of R){try{const r=await fetch(b+'/api/v3/klines?symbol='+sym+'&interval='+tf+'&limit=250',{cache:'no-store'});if(!r.ok)continue;const raw=await r.json();if(!Array.isArray(raw)||!raw.length)continue;bars=raw.map(k=>({time:k[0]/1000|0,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));return 1}catch(e){}}st('ошибка');toast('Нет связи');return 0}
function wsc(){if(ws)try{ws.close()}catch(e){}const s=sym.toLowerCase()+'@kline_'+tf;let i=0;(function c(){if(i>=W.length)return;try{ws=new WebSocket(W[i++]+'/ws/'+s);ws.onopen=()=>st(sym+' · '+tf+' · live');ws.onmessage=e=>{try{const k=JSON.parse(e.data).k;const bar={time:k.t/1000|0,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};if(series)series.update(bar);if(volS)volS.update({time:bar.time,value:bar.volume,color:bar.close>=bar.open?'rgba(48,209,88,.25)':'rgba(255,69,58,.25)'});const L=bars[bars.length-1];if(L&&L.time===bar.time)bars[bars.length-1]=bar;else bars.push(bar);if(bars.length>300)bars.shift();$('last').textContent=fmt(bar.close);dr()}catch(x){}};ws.onerror=()=>{try{ws.close()}catch(x){}c()}}catch(x){c()}})()}
function openP(side,price,size){pos={side,entry:price,size};const sl=side==='long'?price*0.996:price*1.004,tp=side==='long'?price*1.008:price*0.992;ords=ords.filter(o=>o.t!=='sl'&&o.t!=='tp');ords.push({id:oid++,t:'sl',p:+sl.toFixed(price>=1000?1:2)},{id:oid++,t:'tp',p:+tp.toFixed(price>=1000?1:2)});toast((side==='long'?'Long':'Short')+' x'+size);dr()}
function init(){const el=$('ch');chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0c0c0c'},textColor:'#555',attributionLogo:false},grid:{vertLines:{color:'#141414'},horzLines:{color:'#141414'}},rightPriceScale:{borderColor:'#1a1a1a',scaleMargins:{top:.02,bottom:.04},minimumWidth:56},timeScale:{borderColor:'#1a1a1a',timeVisible:true},crosshair:{mode:0},handleScroll:true,handleScale:true});series=chart.addCandlestickSeries({upColor:'#30d158',downColor:'#ff453a',borderUpColor:'#30d158',borderDownColor:'#ff453a',wickUpColor:'#30d158',wickDownColor:'#ff453a'});volS=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',scaleMargins:{top:.985,bottom:0}});new ResizeObserver(()=>{if(el.clientWidth){chart.applyOptions({width:el.clientWidth,height:el.clientHeight});rz();dr()}}).observe(el);chart.timeScale().subscribeVisibleLogicalRangeChange(()=>dr())}
function setD(){series.setData(bars.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));volS.setData(bars.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(48,209,88,.2)':'rgba(255,69,58,.18)'})));const last=bars[bars.length-1].close;$('last').textContent=fmt(last);const o=bars[0].open,ch=((last-o)/o)*100;const e=$('chg');e.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';e.className='ch '+(ch>=0?'up':'dn');$('sym').textContent=sym;chart.timeScale().fitContent();st(sym+' · '+tf);rz();setTimeout(()=>{rz();dr()},50)}
function struct(d){const z=[],sw=[],lb=8;for(let i=lb;i<d.length-lb;i++){let h=1,l=1;for(let k=1;k<=lb;k++){if(d[i-k].high>=d[i].high||d[i+k].high>d[i].high)h=0;if(d[i-k].low<=d[i].low||d[i+k].low<d[i].low)l=0}if(h)sw.push({t:d[i].time,p:d[i].high,ty:'h'});if(l)sw.push({t:d[i].time,p:d[i].low,ty:'l'})}for(let i=6;i<d.length-6;i++){const c=d[i],bd=Math.abs(c.close-c.open),rg=c.high-c.low;if(rg<=0||bd/rg<.6)continue;const n=d.slice(i+1,i+8);if(c.close>c.open&&n.filter(x=>x.low>c.high).length>=4)z.push({top:c.open,bot:c.low,t:c.time,ty:'d'});if(c.close<c.open&&n.filter(x=>x.high<c.low).length>=4)z.push({top:c.high,bot:c.open,t:c.time,ty:'s'})}return{z:z.slice(-5),sw:sw.slice(-6)}}
function vp(d,bins=48){let s=d.slice(-100);try{const r=chart.timeScale().getVisibleLogicalRange();if(r){const f=Math.max(0,Math.floor(r.from)),t=Math.min(d.length-1,Math.ceil(r.to));if(t>f)s=d.slice(f,t+1)}}catch(e){}if(!s.length)return{bins:[],poc:null};let lo=Math.min(...s.map(x=>x.low)),hi=Math.max(...s.map(x=>x.high));if(hi<=lo)return{bins:[],poc:null};const step=(hi-lo)/bins;const h=Array.from({length:bins},(_,i)=>({p:lo+(i+.5)*step,v:0,b:0}));for(const c of s){let i=Math.floor(((c.high+c.low)/2-lo)/step);if(i<0)i=0;if(i>=bins)i=bins-1;h[i].v+=c.volume;if(c.close>=c.open)h[i].b+=c.volume}const m=Math.max(...h.map(x=>x.v),1);const poc=h.reduce((a,b)=>b.v>a.v?b:a);return{bins:h.map(x=>({...x,r:x.v/m})),poc}}
function rz(){const w=$('ch').parentElement;if(!w)return;$('ov').width=w.clientWidth;$('ov').height=w.clientHeight;const vpEl=$('vp');let rw=56;try{const ww=chart.priceScale('right').width();if(ww>20)rw=ww}catch(e){}vpEl.style.right=(rw-1)+'px';vpEl.width=50;vpEl.height=w.clientHeight||1}
function dr(){if(!chart||!series||!bars.length)return;const c=$('ov').getContext('2d'),w=$('ov').width,h=$('ov').height;if(!w||!h)return;c.clearRect(0,0,w,h);const ts=chart.timeScale();let vpW=106;try{vpW=(chart.priceScale('right').width()||56)+50}catch(e){}if(showS){const S=struct(bars);for(const z of S.z){let x1=ts.timeToCoordinate(z.t);if(x1==null)x1=0;const y1=series.priceToCoordinate(z.top),y2=series.priceToCoordinate(z.bot);if(y1==null||y2==null)continue;const top=Math.min(y1,y2),ht=Math.abs(y2-y1);if(ht<3)continue;c.fillStyle=z.ty==='d'?'rgba(48,209,88,.1)':'rgba(255,69,58,.08)';c.fillRect(x1,top,Math.max(20,w-vpW-x1),ht)}for(const s of S.sw){const x=ts.timeToCoordinate(s.t),y=series.priceToCoordinate(s.p);if(x==null||y==null)continue;c.fillStyle=s.ty==='h'?'#ff453a':'#30d158';c.beginPath();if(s.ty==='h'){c.moveTo(x,y-4);c.lineTo(x-3,y);c.lineTo(x+3,y)}else{c.moveTo(x,y+4);c.lineTo(x-3,y);c.lineTo(x+3,y)}c.fill()}}if(pos){const y=series.priceToCoordinate(pos.entry);if(y!=null){c.strokeStyle=pos.side==='long'?'#30d158':'#ff453a';c.setLineDash([5,3]);c.lineWidth=1.5;c.beginPath();c.moveTo(0,y);c.lineTo(w-vpW,y);c.stroke();c.setLineDash([]);c.fillStyle=c.strokeStyle;c.font='bold 10px system-ui';c.fillText((pos.side==='long'?'L':'S')+' '+fmt(pos.entry),6,y-3)}}for(const o of ords){const y=series.priceToCoordinate(o.p);if(y==null)continue;c.strokeStyle=o.t==='tp'?'#30d158':'#ff453a';c.setLineDash([4,3]);c.lineWidth=1.5;c.beginPath();c.moveTo(0,y);c.lineTo(w-vpW,y);c.stroke();c.setLineDash([]);c.fillStyle=c.strokeStyle;c.font='bold 10px system-ui';c.fillText(o.t.toUpperCase()+' '+fmt(o.p),6,y-3)}const vpC=$('vp');if(vpC&&showV){const vc=vpC.getContext('2d'),vw=vpC.width,vh=vpC.height;vc.clearRect(0,0,vw,vh);const V=vp(bars,48),n=Math.max(V.bins.length,1),step=vh/n;for(const b of V.bins){const y=series.priceToCoordinate(b.p);if(y==null)continue;const bw=Math.max(1,Math.round(b.r*(vw-1))),bh=Math.max(1,Math.floor(step*.9)),buyW=Math.round(bw*(b.b/(b.v||1))),x0=vw-bw,yy=Math.round(y-bh/2);if(buyW>0){vc.fillStyle='#30d158';vc.globalAlpha=.85;vc.fillRect(x0,yy,buyW,bh)}if(bw-buyW>0){vc.fillStyle='#ff453a';vc.globalAlpha=.75;vc.fillRect(x0+buyW,yy,bw-buyW,bh)}vc.globalAlpha=1}if(V.poc){const y=series.priceToCoordinate(V.poc.p);if(y!=null){vc.strokeStyle='#0a84ff';vc.lineWidth=2;vc.beginPath();vc.moveTo(0,Math.round(y));vc.lineTo(vw,Math.round(y));vc.stroke()}}vc.strokeStyle='rgba(255,255,255,.1)';vc.beginPath();vc.moveTo(vw-.5,0);vc.lineTo(vw-.5,vh);vc.stroke()}else if(vpC)vpC.getContext('2d').clearRect(0,0,vpC.width,vpC.height)}
async function ldT(){$('scr').innerHTML='<div style="padding:30px;text-align:center;color:var(--t3)">...</div>';for(const b of R){try{const r=await fetch(b+'/api/v3/ticker/24hr',{cache:'no-store'});if(!r.ok)continue;const d=await r.json();if(!Array.isArray(d))continue;tks=d.filter(t=>t.symbol.endsWith('USDT')&&!t.symbol.includes('_')&&+t.quoteVolume>2e6);rScr('g');return}catch(e){}}$('scr').innerHTML='<div style="padding:30px;text-align:center;color:var(--r)">Ошибка</div>'}
