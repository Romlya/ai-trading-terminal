<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>AI Trading Terminal</title>
</head>
<body>
<div id="boot" style="color:#94a3b8;padding:24px;font-family:system-ui">Загрузка терминала…</div>
<script>
(async function(){
  try {
    var base = 'https://cdn.jsdelivr.net/gh/Romlya/ai-trading-terminal@main/';
    var parts = await Promise.all([1,2,3].map(function(i){
      return fetch(base+'app.gz.'+i+'.b64?t='+Date.now()).then(function(r){
        if(!r.ok) throw new Error('chunk '+i+' '+r.status);
        return r.text();
      });
    }));
    var b64 = parts.join('');
    var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    var ds = new DecompressionStream('gzip');
    var stream = new Response(bin).body.pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('boot').innerHTML = '<div style="color:#f87171">Load error: '+e.message+'</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
