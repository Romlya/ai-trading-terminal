<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Terminal</title>
<style>html,body{margin:0;background:#000;color:#8e8e93;font-family:system-ui;height:100%;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div id="s">Загрузка…</div>
<script>
(async()=>{
  const el=document.getElementById('s');
  try{
    const base='https://cdn.jsdelivr.net/gh/Romlya/ai-trading-terminal@8fa938283f4e4904ff7b2466e5b052dbe10ab15c/deploy/';
    let b64='';
    for(let i=0;i<16;i++){
      const n='f'+String(i).padStart(2,'0');
      const r=await fetch(base+n+'.txt',{cache:'no-store'});
      if(!r.ok)throw new Error(n+' '+r.status);
      b64+=(await r.text()).trim();
    }
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bin]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    el.textContent='Ошибка: '+(e&&e.message?e.message:e);
    console.error(e);
  }
})();
</script>
</body>
</html>
