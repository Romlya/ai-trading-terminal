<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>AI Trading Terminal</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:0 10px;height:46px;flex-shrink:0;border-bottom:1px solid;overflow-x:auto}
.main{flex:1;display:flex;min-height:0}
.chart-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.side{width:320px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid;min-height:0}
.tabs{display:flex;overflow-x:auto;flex-shrink:0;border-bottom:1px solid}
.tabs button{flex:1;min-width:52px;padding:10px 4px;border:none;background:none;font-size:11px;cursor:pointer;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;color:inherit}
.pane{flex:1;overflow:auto;padding:12px}
.btn{border:1px solid;padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;background:transparent;font-weight:500}
.btn-on{color:#fff!important}
.buy{background:#22c55e;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;width:100%;cursor:pointer}
.sell{background:#ef4444;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;width:100%;cursor:pointer}
.fld{margin-bottom:8px}
.fld label{display:block;font-size:11px;margin-bottom:4px;opacity:.7}
.fld input,.fld select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid;font-size:14px;outline:none}
.row{display:flex;gap:8px}
.chip{padding:4px 8px;border-radius:6px;border:1px solid;font-size:11px;cursor:pointer}
.menu{position:absolute;z-index:20;border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:140px}
.menu button{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;
const REST=['https://data-api.binance.vision','https://api.binance.com','https://api1.binance.com'];
const WS=['wss://data-stream.binance.vision','wss://stream.binance.com:9443'];
const SYMS=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','AVAXUSDT','DOTUSDT','LINKUSDT'];
const TFS=['1m','5m','15m','1h','4h','1d'];
const CTH={classic:{u:'#22c55e',d:'#ef4444',bu:'#16a34a',bd:'#dc2626',wu:'#22c55e',wd:'#ef4444'},mono:{u:'#e2e8f0',d:'#1e293b',bu:'#cbd5e1',bd:'#0f172a',wu:'#e2e8f0',wd:'#0f172a'},purple:{u:'#a78bfa',d:'#7c3aed',bu:'#8b5cf6',bd:'#6d28d9',wu:'#a78bfa',wd:'#6d28d9'}};
const DK={bg:'#0a0a0f',bg2:'#12121a',bg3:'#1a1a24',bg4:'#1e1e2e',bg5:'#25253a',bd:'#2d2d3f',tx:'#e5e7eb',tx2:'#9ca3af',ac:'#7c3aed',ac2:'#a78bfa',rd:'#ef4444',gn:'#22c55e',gr:'#1a1a28'};
const LT={bg:'#f8fafc',bg2:'#ffffff',bg3:'#f1f5f9',bg4:'#e2e8f0',bg5:'#cbd5e1',bd:'#cbd5e1',tx:'#1e293b',tx2:'#64748b',ac:'#7c3aed',ac2:'#6d28d9',rd:'#dc2626',gn:'#16a34a',gr:'#e2e8f0'};

function fk(s,i,n){let j=0;const p='/api/v3/klines?symbol='+s+'&interval='+i+'&limit='+(n||200);
  function nx(){if(j>=REST.length)return Promise.reject(new Error('Binance unavailable'));
    return fetch(REST[j++]+p,{mode:'cors',cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();})
      .then(d=>{if(!Array.isArray(d))throw 0;return d;}).catch(()=>nx());}
  return nx();}

function rsi(d,p){if(!d||d.length<p+1)return[];let r=[],g=0,l=0;
  for(let i=1;i<=p;i++){const v=d[i].close-d[i-1].close;if(v>0)g+=v;else l-=v;}
  let ag=g/p,al=l/p;r.push({time:d[p].time,value:al===0?100:100-100/(1+ag/al)});
  for(let i=p+1;i<d.length;i++){const v=d[i].close-d[i-1].close;ag=(ag*(p-1)+(v>0?v:0))/p;al=(al*(p-1)+(v<0?-v:0))/p;
    r.push({time:d[i].time,value:al===0?100:100-100/(1+ag/al)});}return r;}

function smc(d){if(!d||d.length<10)return{b:[],f:[],o:[]};const b=[],f=[],o=[];
  for(let i=5;i<d.length-2;i++){const H=d[i].high,L=d[i].low;
    const pH=Math.max(d[i-1].high,d[i-2].high),pL=Math.min(d[i-1].low,d[i-2].low);
    if(H>pH&&d[i].close>d[i].open)b.push({time:d[i].time,price:H,t:'bull'});
    if(L<pL&&d[i].close<d[i].open)b.push({time:d[i].time,price:L,t:'bear'});
    if(i>=2){const fT=Math.min(d[i-2].low,d[i-1].low),fB=Math.max(d[i+1].high,d[i+2].high);
      if(fT>fB){const md=(fT+fB)/2,lc=d[i].close;
        if((lc>md&&d[i].close>d[i].open)||(lc<md&&d[i].close<d[i].open))
          f.push({time:d[i].time,top:fT,bot:fB,t:lc>md?'bull':'bear'});}}
    if(i>=3&&i<d.length-1){const bd=Math.abs(d[i].close-d[i].open),wk=d[i].high-d[i].low;
      if(wk>bd*2){const isB=d[i].close>d[i].open;
        const fu=d.slice(i+1,i+4).every(k=>k.close>d[i].open);
        const fd=d.slice(i+1,i+4).every(k=>k.close<d[i].open);
        if(isB&&fu)o.push({time:d[i].time,price:d[i].low,t:'bull'});
        if(!isB&&fd)o.push({time:d[i].time,price:d[i].high,t:'bear'});}}}
  return{b,f,o};}

function fmtP(v){if(v==null||isNaN(v))return'\u2014';return v>=1000?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(6);}

function App(){
  const[bg,setBg]=useState('dark');const T=bg==='dark'?DK:LT;
  const[symbol,setSym]=useState('BTCUSDT');
  const[tf,setTf]=useState('15m');
  const[price,setPrice]=useState(null);
  const[cnd,setCnd]=useState('classic');
  const[tab,setTab]=useState('trade');
  const[err,setErr]=useState('');
  const[pd,setPd]=useState([]);
  const[side,setSide]=useState('buy');
  const[otype,setOtype]=useState('MARKET');
  const[lprice,setLpr]=useState('');
  const[size,setSz]=useState('0.01');
  const[sl,setSl]=useState('');
  const[tp,setTp]=useState('');
  const[oby,setOby]=useState(false);
  const[live,setLive]=useState(false);
  const[pos,setPos]=useState(null);
  const[pnl,setPnl]=useState(0);
  const[ak,setAk]=useState(()=>localStorage.getItem('bk')||'');
  const[as_,setAs_]=useState(()=>localStorage.getItem('bs')||'');
  const[tn,setTn]=useState(()=>localStorage.getItem('bt')==='1');
  const[am,setAm]=useState('');
  const[bal,setBal]=useState([]);
  const[scr,setScr]=useState('hot');
  const[sch,setSch]=useState('');
  const[all,setAll]=useState([]);
  const[wl,setWl]=useState(()=>{try{return JSON.parse(localStorage.getItem('wl'))||['BTCUSDT','ETHUSDT','SOLUSDT'];}catch(e){return['BTCUSDT','ETHUSDT','SOLUSDT'];}});
  const[wla,setWla]=useState('');
  const[als,setAls]=useState([]);
  const[alp,setAlp]=useState('');
  const[ald,setAld]=useState('above');
  const[lvl,setLvl]=useState([]);
  const[zon,setZon]=useState([]);
  const[fvg,setFvg]=useState([]);
  const[ses,setSes]=useState(null);
  const[bias,setBias]=useState('neutral');
  const[aln,setAln]=useState('');
  const[ai,setAi]=useState([]);
  const[aii,setAii]=useState('');

  const cRef=useRef(null);const sRef=useRef(null);const rsRef=useRef(null);const wRef=useRef(null);
  const cCRef=useRef(null);const rsCRef=useRef(null);const zCRef=useRef(null);const aiScroll=useRef(null);
  const tkMap=useRef({});

  useEffect(()=>{localStorage.setItem('bk',ak);localStorage.setItem('bs',as_);localStorage.setItem('bt',tn?'1':'0');},[ak,as_,tn]);
  useEffect(()=>{localStorage.setItem('wl',JSON.stringify(wl));},[wl]);

  const smcD=useMemo(()=>smc(pd),[pd]);
  const rsiD=useMemo(()=>rsi(pd,14),[pd]);

  useEffect(()=>{
    if(!cCRef.current)return;
    const ch=LightweightCharts.createChart(cCRef.current,{layout:{background:{color:T.bg},textColor:T.tx2},grid:{vertLines:{color:T.gr},horzLines:{color:T.gr}},rightPriceScale:{borderColor:T.bd},timeScale:{borderColor:T.bd,timeVisible:true},crosshair:{mode:0}});
    const ct=CTH[cnd];
    const sr=ch.addCandlestickSeries({upColor:ct.u,downColor:ct.d,borderUpColor:ct.bu,borderDownColor:ct.bd,wickUpColor:ct.wu,wickDownColor:ct.wd});
    cRef.current=ch;sRef.current=sr;
    const ro=new ResizeObserver(()=>{if(cCRef.current)ch.applyOptions({width:cCRef.current.clientWidth,height:cCRef.current.clientHeight});});
    ro.observe(cCRef.current);
    return ()=>{ro.disconnect();ch.remove();};
  },[bg,cnd]);

  useEffect(()=>{
    if(!rsCRef.current||rsiD.length===0)return;
    const ch=LightweightCharts.createChart(rsCRef.current,{layout:{background:{color:T.bg},textColor:T.tx2},grid:{vertLines:{visible:false},horzLines:{visible:false}},rightPriceScale:{borderColor:T.bd},timeScale:{visible:false},crosshair:{mode:0}});
    const sr=ch.addLineSeries({color:T.ac2,lineWidth:1});
    sr.setData(rsiD);
    rsRef.current=sr;
    const ro=new ResizeObserver(()=>{if(rsCRef.current)ch.applyOptions({width:rsCRef.current.clientWidth,height:rsCRef.current.clientHeight});});
    ro.observe(rsCRef.current);
    return ()=>{ro.disconnect();ch.remove();};
  },[rsiD,T]);

  useEffect(()=>{
    if(!zCRef.current||!sRef.current||pd.length===0)return;
    const cv=zCRef.current;const ctx=cv.getContext('2d');const ch=cRef.current;
    function draw(){
      if(!cv.parentElement)return;
      cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight;
      ctx.clearRect(0,0,cv.width,cv.height);
      const ts=ch.timeScale();
      smcD.b.forEach(b=>{const x=ts.timeToCoordinate(b.time);if(x==null)return;const y=sRef.current.priceToCoordinate(b.price);if(y==null)return;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=b.t==='bull'?'#22c55e':'#ef4444';ctx.fill();ctx.font='9px sans-serif';ctx.fillStyle=T.tx2;ctx.fillText('BOS',x+6,y-4);});
      smcD.f.forEach(f=>{const x1=ts.timeToCoordinate(f.time);if(x1==null)return;const y1=sRef.current.priceToCoordinate(f.top);const y2=sRef.current.priceToCoordinate(f.bot);if(y1==null||y2==null)return;ctx.fillStyle=f.t==='bull'?'rgba(34,197,94,0.08)':'rgba(239,68,68,0.08)';ctx.fillRect(x1-20,Math.min(y1,y2),40,Math.abs(y2-y1));});
      smcD.o.forEach(o=>{const x=ts.timeToCoordinate(o.time);if(x==null)return;const y=sRef.current.priceToCoordinate(o.price);if(y==null)return;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=o.t==='bull'?'rgba(34,197,94,0.5)':'rgba(239,68,68,0.5)';ctx.fill();ctx.font='8px sans-serif';ctx.fillStyle=T.tx2;ctx.fillText('OB',x+5,y+3);});
    }
    draw();
    const id=setInterval(draw,500);
    return ()=>clearInterval(id);
  },[smcD,pd,T]);

  useEffect(()=>{
    let cancelled=false;setErr('');
    if(wRef.current){try{wRef.current.close();}catch(e){}wRef.current=null;}
    fk(symbol,tf,250).then(raw=>{
      if(cancelled||!sRef.current)return;
      const data=raw.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
      sRef.current.setData(data);setPd(data);
      if(data.length)setPrice(data[data.length-1].close);
      if(data.length){const hs=data.slice(-50).map(d=>d.high);const ls=data.slice(-50).map(d=>d.low);setSes({high:Math.max(...hs),low:Math.min(...ls)});}
      const stream=symbol.toLowerCase()+'@kline_'+tf;let wi=0;
      function conn(){if(wi>=WS.length||cancelled)return;try{const ws=new WebSocket(WS[wi++]+'/ws/'+stream);ws.onmessage=ev=>{try{const k=JSON.parse(ev.data).k;if(!k||!sRef.current)return;const bar={time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c};sRef.current.update(bar);setPrice(+k.c);setPd(p=>{const last=p[p.length-1];if(last&&last.time===bar.time){const n=p.slice(0,-1);n.push(bar);return n;}return p.concat([bar]).slice(-300);});}catch(e){}};ws.onerror=()=>{try{ws.close();}catch(e){}conn();};wRef.current=ws;}catch(e){conn();}}
      conn();
    }).catch(e=>{if(!cancelled)setErr(e.message||'Error');});
    return ()=>{cancelled=true;if(wRef.current)try{wRef.current.close();}catch(e){};};
  },[symbol,tf]);

  useEffect(()=>{
    const iv=setInterval(()=>{
      fetch(REST[0]+'/api/v3/ticker/24hr',{mode:'cors'}).then(r=>r.json()).then(data=>{
        if(!Array.isArray(data))return;const m={};
        data.forEach(t=>{m[t.symbol]={p:parseFloat(t.lastPrice),c:parseFloat(t.priceChangePercent),v:parseFloat(t.quoteVolume)};});
        tkMap.current=m;
        setAll(SYMS.map(s=>({s,p:m[s]?m[s].p:0,c:m[s]?m[s].c:0,v:m[s]?m[s].v:0})).filter(x=>x.p>0).sort((a,b)=>b.v-a.v));
      });
    },5000);
    return ()=>clearInterval(iv);
  },[]);

  useEffect(()=>{
    if(!live||!pos)return;
    const iv=setInterval(()=>{setPnl(()=>{const cp=price||pos.entry;const diff=pos.side==='long'?cp-pos.entry:pos.entry-cp;return diff*pos.size;});},1000);
    return ()=>clearInterval(iv);
  },[live,pos,price]);

  useEffect(()=>{if(aiScroll.current)aiScroll.current.scrollTop=aiScroll.current.scrollHeight;},[ai]);

  async function place(){if(!ak||!as_){setAm('Set API keys in Theme');setTab('theme');return;}setOby(true);try{const body={action:'order',testnet:tn,symbol,side:side.toUpperCase(),type:otype.toUpperCase(),quantity:size};if(otype==='LIMIT'){body.price=lprice;body.timeInForce='GTC';}const r=await fetch('/api/binance',{method:'POST',headers:{'Content-Type':'application/json','X-API-KEY':ak,'X-API-SECRET':as_},body:JSON.stringify(body)});const d=await r.json();if(d.ok){setPos({side,size:parseFloat(size),entry:price,sl:sl?parseFloat(sl):0,tp:tp?parseFloat(tp):0});setAm('Order: '+d.order.orderId);}else setAm('Error: '+d.error);}catch(e){setAm('Error: '+e.message);}setOby(false);}

  async function checkAcct(){if(!ak||!as_){setAm('Enter API Key and Secret');return;}try{const r=await fetch('/api/binance',{method:'POST',headers:{'Content-Type':'application/json','X-API-KEY':ak,'X-API-SECRET':as_},body:JSON.stringify({action:'account',testnet:tn})});const d=await r.json();if(d.ok){setAm('OK. Trade: '+d.canTrade);setBal(d.balances||[]);}else setAm('Error: '+d.error);}catch(e){setAm('Error: '+e.message);}}

  function addWl(){let s=wla.trim().toUpperCase();if(!s)return;if(!s.endsWith('USDT'))s=s+'USDT';if(!wl.includes(s))setWl(wl.concat([s]));setWla('');}

  function runStruct(){if(pd.length<10)return;const nl=[];const l50=pd.slice(-50);const hi=Math.max(...l50.map(d=>d.high));const lo=Math.min(...l50.map(d=>d.low));nl.push({id:'r1',price:hi,type:'res',label:'R High',src:'session'});nl.push({id:'s1',price:lo,type:'sup',label:'S Low',src:'session'});nl.push({id:'r2',price:(hi+lo)*0.618+lo,type:'res',label:'Fib 61.8',src:'fib'});nl.push({id:'s2',price:(hi+lo)*0.382+lo,type:'sup',label:'Fib 38.2',src:'fib'});setLvl(nl);const sd=smc(pd);setZon(sd.f.map((f,i)=>({id:'f'+i,top:f.top,bot:f.bot,type:f.t,label:'FVG',time:f.time})));if(pd.length>20){const lc=pd[pd.length-1].close;const pc=pd[pd.length-5].close;setBias(lc>pc?'bullish':lc<pc?'bearish':'neutral');setAln(lc>hi*0.7?'near resistance':'near support');}}

  function clearAll(){setLvl([]);setZon([]);setFvg([]);setBias('neutral');setAln('');setSes(null);}

  function sendAi(){if(!aii.trim())return;const q=aii.trim().toLowerCase();setAi(m=>m.concat([{r:'user',t:aii}]));setAii('');setTimeout(()=>{let reply='';if(q.includes('setup')){const last=pd[pd.length-1];if(last){const rv=rsiD.length?rsiD[rsiD.length-1].value:50;const sc=smcD.b.length+smcD.f.length+smcD.o.length;reply='Setup '+symbol+' '+tf+':\nPrice: '+fmtP(last.close)+'\nRSI: '+rv.toFixed(1)+'\nSMC: '+sc+'\nBias: '+bias;}else reply='No data.';}else if(q.includes('mtf'))reply='MTF: '+TFS.join(', ');else if(q.includes('struct'))reply='BOS:'+smcD.b.length+' FVG:'+smcD.f.length+' OB:'+smcD.o.length;else if(q.includes('pos')){if(pos)reply=pos.side.toUpperCase()+' '+pos.size+' @ '+fmtP(pos.entry)+' PnL:$'+pnl.toFixed(4);else reply='No position.';}else if(q.includes('help'))reply='setup/mtf/struct/pos/help';else reply=symbol+' '+fmtP(price)+' RSI:'+(rsiD.length?rsiD[rsiD.length-1].value.toFixed(1):'\u2014');setAi(m=>m.concat([{r:'bot',t:reply}]));},300);}

  const filtered=useMemo(()=>{let l=all;if(sch)l=l.filter(s=>s.s.toLowerCase().includes(sch.toLowerCase()));return l;},[all,sch]);

  const st={btn:{border:'1px solid '+T.bd,padding:'6px 10px',borderRadius:6,fontSize:12,cursor:'pointer',background:'transparent',color:T.tx,fontWeight:500},btnOn:{border:'1px solid '+T.ac,padding:'6px 10px',borderRadius:6,fontSize:12,cursor:'pointer',background:T.ac,color:'#fff',fontWeight:500},inp:{width:'100%',background:T.bg3,border:'1px solid '+T.bd,color:T.tx,borderRadius:8,padding:'10px 12px',fontSize:14,outline:'none'}};

  return (
    <div className="wrap" style={{background:T.bg,color:T.tx}}>
      <div className="top" style={{background:T.bg2,borderColor:T.bd}}>
        <div style={{display:'flex',alignItems:'baseline',gap:8,flexShrink:0}}>
          <span style={{fontWeight:700,fontSize:15}}>{symbol.replace('USDT','')}</span>
          <span style={{fontWeight:600,fontSize:15,color:T.ac2}}>{price!=null?fmtP(price):'\u2014'}</span>
          <span style={{fontSize:10,padding:'2px 7px',borderRadius:10,fontWeight:500,background:T.bg4,color:T.tx2}}>{tf}</span>
        </div>
        <div style={{display:'flex',gap:2,marginLeft:4,overflowX:'auto'}}>
          {TFS.map(t=><button key={t} className="btn" style={tf===t?st.btnOn:st.btn} onClick={()=>setTf(t)}>{t}</button>)}
        </div>
        <span style={{marginLeft:'auto',fontSize:10,color:T.tx2}}>{smcD.b.length}BOS {smcD.f.length}FVG {smcD.o.length}OB</span>
      </div>
      <div className="main">
        <div className="chart-col">
          <div style={{padding:'5px 8px',borderBottom:'1px solid '+T.bg3,display:'flex',gap:4,flexWrap:'wrap',alignItems:'center',flexShrink:0}}>
            <span style={{fontSize:11,color:T.tx2}}>{symbol} {tf}</span>
            <span style={{fontSize:10,padding:'3px 8px',borderRadius:5,border:'1px solid '+T.bd,color:rsiD.length?T.ac2:T.tx2}}>RSI14: {rsiD.length?rsiD[rsiD.length-1].value.toFixed(1):'\u2014'}</span>
          </div>
          <div style={{flex:1,position:'relative',minHeight:140,overflow:'hidden'}}>
            <div ref={cCRef} style={{width:'100%',height:'100%'}}/>
            <canvas ref={zCRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:1}}/>
            {err&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',zIndex:3}}><span style={{color:T.rd}}>{err}</span></div>}
          </div>
          <div ref={rsCRef} style={{height:56,borderTop:'1px solid '+T.bg3,flexShrink:0}}/>
        </div>
        <div className="side" style={{background:T.bg2,borderColor:T.bd}}>
          <div className="tabs" style={{borderColor:T.bd}}>
            {['trade','dom','scr','wl','al','lv','ai','theme'].map(t=>{const lb={trade:'Trade',dom:'DOM',scr:'Scr',wl:'Watch',al:'Alert',lv:'Lv',ai:'AI',theme:'Theme'};return <button key={t} style={{borderBottom:tab===t?'2px solid '+T.ac:'2px solid transparent',color:tab===t?T.ac:T.tx2}} onClick={()=>setTab(t)}>{lb[t]}</button>;})}
          </div>
          <div className="pane">
            {tab==='trade'&&(
              <div style={{display:'flex',flexDirection:'column',gap:11}}>
                <div className="row">
                  <button className="buy" style={side==='buy'?{}:{background:T.bg3,color:T.tx2}} onClick={()=>setSide('buy')}>BUY</button>
                  <button className="sell" style={side==='sell'?{}:{background:T.bg3,color:T.tx2}} onClick={()=>setSide('sell')}>SELL</button>
                </div>
                <div className="row">
                  {['MARKET','LIMIT'].map(t=><button key={t} className="btn" style={otype===t?st.btnOn:st.btn} onClick={()=>setOtype(t)}>{t}</button>)}
                </div>
                <div className="row" style={{flexWrap:'wrap'}}>
                  {['0.001','0.01','0.1','1','10'].map(q=><button key={q} className="chip" style={parseFloat(size)===parseFloat(q)?{borderColor:T.ac,background:T.ac,color:'#fff'}:{borderColor:T.bd}} onClick={()=>setSz(q)}>{q}</button>)}
                </div>
                <div className="fld"><label>Size</label><input style={st.inp} type="number" value={size} onChange={e=>setSz(e.target.value)} placeholder="0.01"/></div>
                {otype==='LIMIT'&&<div className="fld"><label>Limit</label><input style={st.inp} type="number" value={lprice} onChange={e=>setLpr(e.target.value)} placeholder={fmtP(price)}/></div>}
                <div className="row">
                  <div className="fld" style={{flex:1}}><label>SL</label><input style={st.inp} type="number" value={sl} onChange={e=>setSl(e.target.value)} placeholder="stop"/></div>
                  <div className="fld" style={{flex:1}}><label>TP</label><input style={st.inp} type="number" value={tp} onChange={e=>setTp(e.target.value)} placeholder="take"/></div>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid '+T.bd}}>
                  <span style={{fontSize:13}}>Live Binance</span>
                  <button className="btn" style={live?st.btnOn:st.btn} onClick={()=>setLive(v=>!v)}>{live?'ON':'OFF'}</button>
                </div>
                {live&&<div style={{fontSize:11,textAlign:'center',opacity:.65,color:tn?'#f59e0b':T.rd}}>{tn?'TESTNET':'MAINNET'} keys in Theme</div>}
                <button className={side==='buy'?'buy':'sell'} onClick={place} disabled={oby}>{oby?'...':(live?'LIVE ':'')+otype+' '+side+' '+size}</button>
                {pos&&(
                  <div style={{background:T.bg4,borderRadius:8,padding:10,fontSize:12}}>
                    <div>Pos {pos.side.toUpperCase()} {pos.size}</div>
                    <div>Entry ${fmtP(pos.entry)}</div>
                    {pos.sl>0&&<div>SL <span style={{color:T.rd}}>${fmtP(pos.sl)}</span></div>}
                    {pos.tp>0&&<div>TP <span style={{color:T.gn}}>${fmtP(pos.tp)}</span></div>}
                    <div>PnL <span style={{color:pnl>=0?T.gn:T.rd}}>${pnl.toFixed(4)}</span></div>
                    <button className="btn" style={{marginTop:8,width:'100%'}} onClick={()=>setPos(null)}>Close</button>
                  </div>
                )}
                <div style={{fontSize:11,textAlign:'center',opacity:.65}}>{live?(tn?'Live TESTNET':'Live MAINNET'):'Mock auto SL/TP'}</div>
              </div>
            )}
            {tab==='dom'&&(
              <div style={{fontSize:12}}>
                <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',fontSize:11,borderBottom:'1px solid '+T.bd,color:T.tx2}}><span>Price</span><span>Size</span></div>
                {price&&Array.from({length:10},(_,i)=>10-i).map(i=>{const p=price*(1+i*0.001);const sz=(Math.random()*2).toFixed(4);return <div key={'a'+i} style={{display:'flex',justifyContent:'space-between',padding:'3px 0',position:'relative',color:T.rd}}><span>{fmtP(p)}</span><span>{sz}</span><div style={{position:'absolute',top:0,bottom:0,right:0,opacity:.15,width:((parseFloat(sz)/2)*100)+'%',background:T.rd}}/></div>;})}
                <div style={{textAlign:'center',padding:6,fontSize:11,borderTop:'1px solid '+T.bd,borderBottom:'1px solid '+T.bd,fontWeight:500,color:T.ac2}}>Spread</div>
                {price&&Array.from({length:10},(_,i)=>i+1).map(i=>{const p=price*(1-i*0.001);const sz=(Math.random()*2).toFixed(4);return <div key={'b'+i} style={{display:'flex',justifyContent:'space-between',padding:'3px 0',position:'relative',color:T.gn}}><span>{fmtP(p)}</span><span>{sz}</span><div style={{position:'absolute',top:0,bottom:0,left:0,opacity:.15,width:((parseFloat(sz)/2)*100)+'%',background:T.gn}}/></div>;})}
              </div>
            )}
            {tab==='scr'&&(
              <div>
                <div className="row" style={{marginBottom:8,flexWrap:'wrap'}}>
                  {[['hot','Hot'],['gainers','Gain'],['losers','Loss'],['volume','Vol']].map(x=><button key={x[0]} className="btn" style={scr===x[0]?st.btnOn:st.btn} onClick={()=>setScr(x[0])}>{x[1]}</button>)}
                </div>
                <div className="fld"><input style={st.inp} value={sch} onChange={e=>setSch(e.target.value)} placeholder="Search..."/></div>
                <div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr 1fr .8fr',padding:'8px 0',fontSize:10,borderBottom:'1px solid '+T.bd,fontWeight:500,color:T.tx2}}><span>Symbol</span><span>Price</span><span>24h%</span><span>Vol</span></div>
                {filtered.map(s=><div key={s.s} style={{display:'grid',gridTemplateColumns:'1.3fr 1fr 1fr .8fr',padding:'10px 0',borderBottom:'1px solid '+T.bd,fontSize:13,cursor:'pointer'}} onClick={()=>setSym(s.s)}><span style={{color:s.s===symbol?T.ac2:T.tx,fontWeight:s.s===symbol?600:400}}>{s.s.replace('USDT','')}</span><span>{fmtP(s.p)}</span><span style={{color:s.c>=0?T.gn:T.rd}}>{(s.c>=0?'+':'')+s.c.toFixed(1)}%</span><span style={{color:T.tx2}}>{(s.v/1e6).toFixed(1)}M</span></div>)}
              </div>
            )}
            {tab==='wl'&&(
              <div>
                <div className="row" style={{marginBottom:8}}>
                  <input style={{...st.inp,flex:1}} value={wla} onChange={e=>setWla(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addWl()} placeholder="BTC / ETHUSDT"/>
                  <button className="btn" style={st.btnOn} onClick={addWl}>+</button>
                </div>
                {wl.map(s=>{const tk=tkMap.current[s];return <div key={s} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'11px 0',borderBottom:'1px solid '+T.bd,fontSize:13,cursor:'pointer',gap:8,background:s===symbol?T.bg4:'transparent'}} onClick={()=>setSym(s)}><span>{s.replace('USDT','')}</span><div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2}}><span>{tk?fmtP(tk.p):(s===symbol?fmtP(price):'\u2014')}</span>{tk&&<span style={{fontSize:11,color:tk.c>=0?T.gn:T.rd}}>{(tk.c>=0?'+':'')+tk.c.toFixed(2)}%</span>}</div><button className="btn" style={{border:'none'}} onClick={e=>{e.stopPropagation();setWl(w=>w.filter(x=>x!==s));}}>x</button></div>;})}
              </div>
            )}
            {tab==='al'&&(
              <div>
                <div className="fld"><label>Price</label><input style={st.inp} type="number" value={alp} onChange={e=>setAlp(e.target.value)} placeholder={fmtP(price)}/></div>
                <div className="row" style={{marginBottom:8}}>
                  <button className="btn" style={ald==='above'?st.btnOn:st.btn} onClick={()=>setAld('above')}>Above</button>
                  <button className="btn" style={ald==='below'?st.btnOn:st.btn} onClick={()=>setAld('below')}>Below</button>
                </div>
                <button className="buy" onClick={()=>{const p=parseFloat(alp);if(p){setAls(a=>a.concat([{id:Date.now(),price:p,dir:ald,fired:false}]));setAlp('');}}}>Add Alert</button>
                {als.map(a=><div key={a.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 12px',borderRadius:8,marginTop:6,background:T.bg4,fontSize:13}}><span>{(a.dir==='above'? '>':'<')+' $'+fmtP(a.price)+(a.fired?' FIRED':'')}</span><button className="btn" style={{border:'none'}} onClick={()=>setAls(x=>x.filter(y=>y.id!==a.id))}>x</button></div>)}
              </div>
            )}
            {tab==='lv'&&(
              <div>
                <div className="row" style={{marginBottom:8,flexWrap:'wrap'}}>
                  <button className="btn" style={st.btnOn} onClick={runStruct}>Structure</button>
                  <button className="btn" style={st.btn} onClick={runStruct}>MTF</button>
                  <button className="btn" style={st.btn} onClick={clearAll}>Clear</button>
                </div>
                {ses&&<div style={{padding:'6px 12px',marginBottom:8,borderRadius:6,background:T.bg4,fontSize:12}}>PDH <b style={{color:T.ac2}}>${fmtP(ses.high)}</b> | PDL <b style={{color:T.ac2}}>${fmtP(ses.low)}</b></div>}
                {bias!=='neutral'&&<div style={{padding:'6px 12px',marginBottom:8,borderRadius:6,background:T.bg4,fontSize:12}}>Bias: <b style={{color:bias==='bullish'?T.gn:T.rd}}>{bias}</b></div>}
                {lvl.map(lv=><div key={lv.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 12px',borderRadius:8,marginBottom:6,background:T.bg4}}><span style={{color:lv.src==='session'?T.ac2:(lv.type==='res'?T.rd:T.gn),fontWeight:500}}>{(lv.label||'?')+' $'+fmtP(lv.price)}</span><button className="btn" style={{border:'none'}} onClick={()=>setLvl(x=>x.filter(y=>y.id!==lv.id))}>x</button></div>)}
                {zon.concat(fvg).map(z=><div key={z.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 12px',borderRadius:8,marginBottom:6,background:T.bg4}}><span style={{color:z.type==='res'?T.rd:T.gn,fontWeight:500}}>{z.label+' $'+fmtP(z.bot)+'-'+fmtP(z.top)}</span><button className="btn" style={{border:'none'}} onClick={()=>{setZon(x=>x.filter(y=>y.id!==z.id));setFvg(x=>x.filter(y=>y.id!==z.id));}}>x</button></div>)}
              </div>
            )}
            {tab==='ai'&&(
              <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
                <div className="row" style={{marginBottom:8,flexWrap:'wrap'}}>
                  {['Setup','MTF','Structure','Position'].map(cmd=><button key={cmd} className="chip" style={{borderColor:T.bd}} onClick={()=>setAii(cmd)}>{cmd}</button>)}
                </div>
                <div ref={aiScroll} style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:8,minHeight:120}}>
                  {ai.length===0&&<div style={{textAlign:'center',color:T.tx2,fontSize:13,padding:20}}>Commands: setup, mtf, struct, pos, help</div>}
                  {ai.map((m,i)=><div key={i} style={{alignSelf:m.r==='user'?'flex-end':'flex-start',maxWidth:'92%',padding:'9px 12px',borderRadius:12,fontSize:13,lineHeight:'1.45',whiteSpace:'pre-wrap',wordBreak:'break-word',background:m.r==='user'?T.ac:T.bg4}}>{m.t}</div>)}
                </div>
                <div className="row" style={{marginTop:8}}>
                  <input style={{...st.inp,flex:1}} value={aii} onChange={e=>setAii(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendAi()} placeholder="Ask AI..."/>
                  <button className="btn" style={st.btnOn} onClick={sendAi}>{'>'}</button>
                </div>
              </div>
            )}
            {tab==='theme'&&(
              <div style={{display:'flex',flexDirection:'column',gap:16}}>
                <div>
                  <div style={{fontSize:11,opacity:.7,marginBottom:8,fontWeight:600}}>THEME</div>
                  <div className="row">
                    <button className="btn" style={bg==='dark'?st.btnOn:st.btn} onClick={()=>setBg('dark')}>Dark</button>
                    <button className="btn" style={bg==='light'?st.btnOn:st.btn} onClick={()=>setBg('light')}>Light</button>
                  </div>
                </div>
                <div>
                  <div style={{fontSize:11,opacity:.7,marginBottom:8,fontWeight:600}}>CANDLES</div>
                  <div className="row" style={{flexWrap:'wrap'}}>
                    {Object.keys(CTH).map(k=><button key={k} className="btn" style={cnd===k?st.btnOn:st.btn} onClick={()=>setCnd(k)}>{k==='classic'?'Классика':k==='mono'?'Ч/Б':'Фиолет'}</button>)}
                  </div>
                </div>
                <div>
                  <div style={{fontSize:11,opacity:.7,marginBottom:8,fontWeight:600}}>BINANCE API</div>
                  <div className="fld"><label>API Key</label><input style={st.inp} type="password" autoComplete="off" value={ak} onChange={e=>setAk(e.target.value)} placeholder="ключ"/></div>
                  <div className="fld"><label>API Secret</label><input style={st.inp} type="password" autoComplete="off" value={as_} onChange={e=>setAs_(e.target.value)} placeholder="секрет"/></div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0'}}>
                    <span style={{fontSize:13}}>Testnet</span>
                    <button className="btn" style={tn?st.btnOn:st.btn} onClick={()=>setTn(v=>!v)}>{tn?'ON':'OFF'}</button>
                  </div>
                  <button className="buy" onClick={checkAcct}>Проверить аккаунт</button>
                  {am&&<div style={{fontSize:11,marginTop:8,opacity:.7}}>{am}</div>}
                  {bal.length>0&&<div style={{marginTop:8,fontSize:12,maxHeight:120,overflow:'auto'}}>{bal.slice(0,12).map(b=><div key={b.asset} style={{display:'flex',justifyContent:'space-between',padding:'2px 0'}}><span>{b.asset}</span><span>{b.free}</span></div>)}</div>}
                  <div style={{fontSize:11,opacity:.55,marginTop:8}}>Ключи только в localStorage. Testnet: testnet.binance.vision</div>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
