<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chart Terminal</title>
</head>
<body style="margin:0;background:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;color:#131722">
<div id="st">Загрузка Chart Terminal…</div>
<script>
(async()=>{
  const st=document.getElementById('st');
  try{
    const [a,b]=await Promise.all(['./p1.b64','./p2.b64'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()})));
    const html=decodeURIComponent(escape(atob(a+b)));
    document.open();document.write(html);document.close();
  }catch(e){st.textContent='Ошибка: '+e.message;console.error(e)}
})();
</script>
</body>
</html>
