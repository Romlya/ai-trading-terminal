<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Terminal</title>
<style>html,body{margin:0;background:#000;color:#8e8e93;font-family:system-ui;height:100%;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div id="s">Загрузка v1.6…</div>
<script>
(async()=>{
  const el=document.getElementById('s');
  try{
    const parts=await Promise.all([0,1,2,3].map(i=>fetch('./q'+i+'.b64?v=16',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('q'+i);return r.text()})));
    const b64=parts.join('').replace(/\s/g,'');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bin]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    el.textContent='Ошибка: '+(e&&e.message?e.message:e);
    console.error(e);
  }
})();
</script>
</body>
</html>
