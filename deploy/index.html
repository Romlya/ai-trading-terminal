<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Terminal</title>
</head>
<body style="margin:0;background:#000;color:#888;font:14px system-ui;display:flex;align-items:center;justify-content:center;height:100vh">
<div id="m">Загрузка…</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/Romlya/ai-trading-terminal/main/deploy/';
    let b64='';
    for(let i=0;i<4;i++){
      const r=await fetch(base+'p'+i+'.txt?v=15');
      if(!r.ok) throw new Error('p'+i+' '+r.status);
      b64+=(await r.text()).trim();
    }
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Response(bin).body.pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('m').textContent='Ошибка: '+e.message}
})();
</script>
</body></html>
