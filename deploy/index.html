<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Terminal</title>
</head>
<body style="margin:0;background:#000;color:#888;font:14px system-ui;display:flex;align-items:center;justify-content:center;height:100vh">
<div id="m">Загрузка…</div>
<script>
(async()=>{
  try{
    const base='https://cdn.jsdelivr.net/gh/Romlya/ai-trading-terminal@main/deploy/';
    const names=['p0a','p0b','p1a','p1b','p2a','p2b','p3a','p3b'];
    let b64='';
    for(const n of names){
      const r=await fetch(base+n+'.txt');
      if(!r.ok) throw new Error(n+' '+r.status);
      b64+=(await r.text()).trim();
    }
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Response(bin).body.pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('m').textContent='Ошибка: '+e.message}
})();
</script>
</body></html>
